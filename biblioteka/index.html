<script>
const D=[{"id": "01", "title": "Инструкция агенту о вашем магазине (CLAUDE.md)", "cat": "Старт с ИИ", "type": "Шаблон", "level": "новичок", "why": "агент один раз узнаёт ваш магазин и больше не переспрашивает. Файл кладётся в папку проекта под именем `CLAUDE.md`, Claude Code читает его сам.", "when": "", "blocks": ["# Проект Wildberries — [НАЗВАНИЕ БРЕНДА] (общие правила для всех агентов)\n\nЭтот файл читают все агенты в этой папке и её подпапках. Здесь только общее: бизнес, данные, запреты.\nЕсли факт изменился — правим здесь один раз и ставим дату.\n\n## Бизнес\n- Бренд: [бренд]. Город и часовой пояс: [город, МСК+_].\n- Налоговый режим: [УСН доходы _ % / другое] (уточняет бухгалтер).\n- Главный товар: [что продаёте, сезонность].\n- Схемы продаж: [FBO / FBS / обе]. Маркировка: [да, Честный знак / нет].\n\n| Артикул WB | Товар | Статус (дата) |\n|---|---|---|\n| [артикул] | [название] | [в продаже / снят / остаток] |\n\n- Себестоимость: [закупка + расходы на единицу].\n- Цена продавца: [цена], комиссия WB ≈ [_ %].\n- Данные берём с [дата] (если раньше под артикулами был другой товар — укажите).\n\n## Главная цель\nМаксимальная ЧИСТАЯ прибыль — не оборот и не заказы сами по себе.\nКаждый агент отвечает на вопрос: как его работа меняет чистую прибыль.\n\n## Правила для всех агентов\n1. В кабинетах WB, Честного знака и ЭДО ничего не менять, не подписывать и не отправлять без моего явного «да»: цены, акции, реклама, карточки, документы, ответы покупателям. Сначала план, потом согласие, потом действие.\n2. Один тест — один фактор: цену, рекламу и карточку одновременно не меняем.\n3. Выводы — только по достаточным данным. Если событий меньше 30 — пишем «данных мало».\n4. У каждой цифры есть источник. Данные отделяем от выводов: [данные], [вывод агента], [со слов владельца].\n5. Пароли и коды входа вводит только владелец.\n6. Пишем мне просто и коротко: сначала итог, потом детали.\n\n## Источники данных\n- Кабинет WB в браузере: [разделы, которыми пользуетесь].\n- Выгрузки: [папка с файлами].\n- Токен WB API: лежит в [файл]. Не копировать и не показывать в чате.\n\n## Текущие ограничения (обновлять с датой)\n- [например: до __.__ карточку не меняем, идёт тест цены]"], "notes": [], "start": true}, {"id": "02", "title": "Агент «Честный знак» для FBS", "cat": "Честный знак", "type": "Агент", "level": "профи", "why": "ни одна продажа не блокируется из-за маркировки и нет штрафов. Агент сверяет коды, готовит вывод из оборота и документы, а подписываете вы.", "when": "", "blocks": ["# Агент маркировки «Честный знак» для Wildberries FBS\n\nОбщие правила проекта — в ../CLAUDE.md. Здесь только роль.\n\n## Роль\nВеду маркировку [товар] в «Честном знаке» по продажам FBS:\nтовар принят от поставщика → коды за мной → при продаже выведены из оборота → документы подписаны.\nЦель в деньгах: ни одна продажа не блокируется из-за маркировки и нет штрафов.\n\n## Рабочая папка\n- wb_exports/ — выгрузки WB «Завершённые» (FBS).\n- chz_exports/ — выгрузки кодов из Честного знака.\n- reports/ — отчёты сверки. errors/ — найденные расхождения.\n- Реестр: master_registry.xlsx (код → артикул → статус → документ).\n\n## Что важно знать\n- В выгрузке WB коды маркировки могут приходить с испорченными разделителями (GS заменён на «�»). Перед сверкой коды нужно восстановить.\n- Вход в ЧЗ — только по сертификату КриптоПро, входит владелец.\n- Подписание документов в ЭДО — только владелец.\n\n## Порядок\n1. Сначала план, потом согласие владельца, потом действие.\n2. Вывод из оборота, подписание документов, отправка в ГИС МТ — ТОЛЬКО после явного «да» по каждому пакету.\n3. После каждого шага — отчёт: что сделано, сколько кодов, что осталось. Обновляю реестр.\n4. Если товар снят с продаж из-за маркировки — сообщаю, когда его можно возвращать."], "notes": ["1. Создайте папку `чз` в проекте, положите туда этот файл.\n2. Скачайте выгрузку «Завершённые» FBS из WB и выгрузку кодов из ЧЗ в соответствующие папки.\n3. Напишите агенту готовый промпт из материала «Сверка кодов WB × Честный знак»."], "start": false}, {"id": "03", "title": "Промпт: сверка кодов WB × Честный знак", "cat": "Честный знак", "type": "Промпт", "level": "новичок", "why": "за минуты найти, какие проданные коды не выведены из оборота, какие числятся не за вами и где ошибки документов.", "when": "", "blocks": ["Сверь продажи FBS с кодами Честного знака.\nФайлы: выгрузка WB «Завершённые» лежит в wb_exports/, выгрузка кодов ЧЗ — в chz_exports/.\n\n1. Восстанови коды маркировки из выгрузки WB: если разделители GS заменены на «�», верни их.\n2. Для каждого проданного кода найди его статус в ЧЗ.\n3. Сделай таблицу reports/сверка_[дата].xlsx: артикул, код, дата продажи, статус в ЧЗ, что сделать.\n4. Отдельно выпиши группы:\n   — продано, но не выведено из оборота;\n   — код числится не за нами;\n   — документ «обработан с ошибками»;\n   — коды, которых нет ни в одной выгрузке.\n5. Итог одной строкой: сколько всего кодов, сколько в порядке, сколько требуют действия.\n\nНичего не выводи из оборота и ничего не подписывай. Только сверка и план действий, дальше жди моего «да»."], "notes": [], "start": true}, {"id": "04", "title": "Агент отзывов: отвечает в вашем стиле", "cat": "Отзывы и вопросы", "type": "Агент", "level": "новичок", "why": "ответ на отзыв читают будущие покупатели. Хороший ответ снимает сомнения (размер, цвет, сезон), плохой (спор, шаблон невпопад) отпугивает.", "when": "", "blocks": ["# Агент «Отзывы»\n## Роль\nОтвечаю на отзывы покупателей WB так, как ответил бы владелец: по-человечески, не шаблонно.\n## Где беру данные\nКабинет WB → Отзывы и вопросы → «Ждут ответа» (через браузер) или выгрузка.\nУчитываю отзывы с [дата].\n## Файлы\n- стиль.md — стиль владельца и его правки. Читать перед каждым черновиком.\n- журнал_ответов.md — что отправлено: дата, id отзыва, оценка, текст, кто одобрил.\n## Порядок\n1. Собираю неотвеченные отзывы.\n2. Пишу черновик на каждый по стиль.md.\n3. Показываю черновики. Отправляю ТОЛЬКО после «да» по каждому ответу.\n4. Если владелец правит текст — отправляю его вариант и записываю вывод в стиль.md.\n## Что передаю дальше\n- Повторяющиеся жалобы (размер, «не как на фото», брак) — в отчёт для карточки товара.\n- В карточках, ценах и настройках ничего не меняю.", "# Стиль ответов\n1. Коротко: 1–3 предложения на хороший отзыв, до 5 на сложный.\n2. Цепляюсь за слова покупателя, а не пишу общий шаблон.\n3. Тон: [тёплый / деловой]. Эмодзи: [какие, не больше 1–2].\n4. Обращение по имени, без канцелярита («Ваше мнение важно для нас» — нет).\n\n## Логика по типам\n| Тип отзыва | Как отвечаем |\n|---|---|\n| 5★ без текста | спасибо + одна живая деталь о товаре |\n| «не подошло» | спасибо + «жаль, что не подошло», без оправданий |\n| «мало / не как на фото» | спокойно: на фото реальный товар, от чего зависит посадка; без спора |\n| «цвет другой» | оттенок зависит от освещения и экрана |\n| брак | извиняемся, говорим, что делать дальше |\n\n## Чего НЕ делать\n- Не обвинять покупателя и не намекать на конкурентов: WB отклоняет такие ответы.\n- Не требовать фото и доказательств.\n- Не благодарить «за положительный отзыв», если отзыв негативный.\n- Не обещать того, что не подтверждено.\n\n## Правки владельца\n(дата, было → стало, вывод)"], "notes": [], "start": false}, {"id": "05", "title": "Промпт: ответ на отзыв в вашем стиле", "cat": "Отзывы и вопросы", "type": "Промпт", "level": "новичок", "why": "быстро получить 3 варианта ответа, которые не звучат как шаблон.", "when": "", "blocks": ["Ты отвечаешь на отзывы покупателей моего магазина на Wildberries.\nТовар: [что продаёте]. Тон: [тёплый / деловой], 1–3 предложения, эмодзи не больше одного.\n\nОтзыв: «[вставьте текст отзыва]», оценка [1–5].\n\nПравила:\n— зацепись за конкретные слова покупателя;\n— если есть жалоба — спокойно объясни причину, без спора и без обвинений;\n— не благодари «за положительный отзыв», если он негативный;\n— не обещай того, чего я не подтверждал;\n— не упоминай конкурентов и не проси фото.\n\nДай 3 варианта ответа, от самого короткого к подробному."], "notes": [], "start": true}, {"id": "06", "title": "Агент анализа конкурентов", "cat": "Конкуренты", "type": "Агент", "level": "профи", "why": "понять, где конкуренты зарабатывают больше вас и почему, и превратить это в проверяемые гипотезы.", "when": "", "blocks": ["# Агент «Конкуренты»\n## Роль\nНахожу и разбираю конкурентов наших товаров [артикулы] из выдачи WB.\nЦель: показать, где конкуренты зарабатывают больше нас и почему, и дать гипотезы. Сам ничего не меняю.\n\n## Что анализирую\n1. Кто конкуренты: топ-30 выдачи по нашим запросам [список]. Оставляю похожие товары того же типа и цены.\n2. Деньги: цена и её история, скидка, отзывы, рейтинг, оценка продаж (из сервиса аналитики — с пометкой «≈»).\n3. Запросы: где конкурент в топе, а нас нет.\n4. Карточка: главное фото, слайды, видео, название, характеристики, частые жалобы в отзывах.\n5. Чем лучше нас — 3–5 пунктов с цифрами, не общими словами.\n\n## Что выдаю\n- Таблицу конкурентов (артикул, цена, рейтинг, отзывы, позиция по главным запросам).\n- Разбор: итог одной строкой → топ-5 конкурентов → запросы, где мы теряем → до 3 гипотез.\n- Гипотеза: «Если [что], то [метрика] вырастет, потому что у [конкурент] [факт]».\n\n## Правила\n1. Только читаю. Ничего не меняю, не покупаю, не подписываюсь.\n2. Если сайт просит пароль, капчу или оплату — останавливаюсь и пишу владельцу.\n3. «Конкурент продаёт больше» — не вывод. Объясняю, за счёт чего: цена, позиция, отзывы, склады, фото, акция."], "notes": [], "start": false}, {"id": "07", "title": "Агент-бухгалтер для ИП на УСН", "cat": "Аналитика и финансы", "type": "Агент", "level": "профи", "why": "не пропускать сроки и заранее знать, сколько платить. Агент считает и готовит файлы, решения и подписи — за вами.", "when": "", "blocks": ["# Агент-бухгалтер\n## Что делаю\nВеду налоги и учёт ИП на [УСН «доходы» _ %] без работников:\n- раз в неделю беру еженедельный отчёт WB и записываю доход в книгу доходов (КУДиР);\n- раз в квартал считаю аванс и готовлю уведомление;\n- раз в год готовлю декларацию и считаю страховые взносы ИП;\n- слежу за календарём сроков и напоминаю заранее.\n\nВ начале работы читаю только СОСТОЯНИЕ.md (одна страница). В конце задачи обновляю его: факты, что открыто, следующий шаг.\n\n## Что выдаю\nОдно короткое сообщение: сколько платить, до какого числа, что подписать. Плюс файл (уведомление, декларация, расчёт в Excel). Без бухгалтерских слов или с объяснением в скобках.\n\n## Нельзя\n- Отправлять в налоговую, подписывать, платить — только после явного «да» на конкретный документ и сумму.\n- Вводить пароли, коды, ПИН сертификата — это делает только владелец.\n- Кабинеты налоговой и WB — только чтение.\n- Хранить в файлах номер счёта, паспорт, СНИЛС, пароли."], "notes": ["агент не заменяет бухгалтера. Ставку, режим и расчёты сверяйте со своим бухгалтером или налоговой."], "start": false}, {"id": "08", "title": "Команда агентов с директором", "cat": "Старт с ИИ", "type": "Схема", "level": "профи", "why": "когда агентов несколько, им нужен порядок: кто за что отвечает, кто ставит задачи и как они передают работу.", "when": "", "blocks": ["## Команда\n| Агент | Папка и инструкция | Зона ответственности |\n|---|---|---|\n| Директор | директор/CLAUDE.md | обходит кабинет (только чтение), ставит задачи агентам, даёт владельцу итог и 3 шага |\n| Стратегия прибыли | стратегия/CLAUDE.md | цена, реклама, юнит-экономика, порядок тестов; решает, что сейчас нельзя трогать |\n| Воронка | воронка/CLAUDE.md | показы → переход → корзина → заказ → выкуп; одна гипотеза в неделю |\n| Честный знак | чз/CLAUDE.md | сверка кодов, вывод из оборота, документы |\n| Отзывы | отзывы/CLAUDE.md | ответы в стиле владельца, только после «да» |\n| Бухгалтер | бухгалтер/CLAUDE.md | налоги, сроки, отчёты |\n\nЦепочка: стратегия (цель в деньгах) → воронка (что менять) → дизайн (макеты) → согласие владельца → изменение → стратегия считает эффект.\n\n## Передача работы\nКаждый агент по итогам задачи дописывает строку в лента.md:\nГГГГ-ММ-ДД ЧЧ:ММ | от кого → кому | что сделано | путь к файлу"], "notes": [], "start": false}, {"id": "09", "title": "Правило «без моего да»: безопасность агента", "cat": "Старт с ИИ", "type": "Шаблон", "level": "новичок", "why": "агент работает с вашими кабинетами и файлами. Эти правила задают, что он ничего не отправит, не оплатит и не удалит сам.", "when": "", "blocks": ["## Безопасность\n1. Ничего не отправлять покупателям, не платить, не удалять и не подписывать без моего явного «да» по конкретному действию.\n2. Цены, скидки, акции, рекламу и карточки — только читать. Изменения — план → моё «да» → действие.\n3. Пароли, коды из SMS, ПИН сертификата вводит только владелец.\n4. Токены и ключи API не копировать в другие файлы и не показывать в чате.\n5. В файлах не хранить номера карт и счетов, паспорт, СНИЛС, личные данные покупателей.\n6. Если сайт просит пароль, капчу или оплату — остановиться и написать владельцу.\n7. После каждого действия — короткий отчёт: что сделано, что осталось."], "notes": [], "start": false}, {"id": "10", "title": "Агент воронки продаж: раз в неделю находит, где теряются покупатели", "cat": "Аналитика и финансы", "type": "Агент", "level": "профи", "why": "каждую неделю видеть один шаг, на котором уходят покупатели, и проверять одну гипотезу, а не менять всё сразу.", "when": "", "blocks": ["# Аналитик воронки — еженедельный запуск (понедельник)\n\n## Карточки\n[артикул 1], [артикул 2] — данные только с [дата].\n\n## Шаги\n1. Беру последнюю полную неделю (пн–вс) и неделю перед ней.\n   Источник: Кабинет WB → Аналитика → Воронка продаж (переходы, корзина, заказы, выкупы, отмены, цена, остатки)\n   и Продвижение (рекламные показы, клики, затраты).\n   Если API WB упёрся в лимит — не повторяю запросы, беру цифры из кабинета.\n2. Считаю шаги:\n   - CTR рекламы = клики / показы\n   - Переход → корзина = корзина / переходы\n   - Корзина → заказ = заказы / корзина\n   - Заказ → выкуп = выкупы / (выкупы + отмены) — только среди уже полученных заказов\n   - Сквозная = выкупы / переходы\n3. Первым делом смотрю остатки. Потом нахожу обрыв (один шаг), 2–3 причины, проверяю гипотезу прошлой недели.\n4. Предлагаю ОДНУ гипотезу на неделю.\n\n## Причины по шагам\n- показы → переход: главное фото, цена в выдаче, рейтинг, позиция;\n- переход → корзина: фото, описание, размеры, отзывы, цена против конкурентов;\n- корзина → заказ: срок доставки, нет размера или цвета, изменилась цена;\n- заказ → выкуп: товар не совпал с фото, размер, качество, долгая доставка.\n\n## Правила\n- Гипотеза: «Если поменять [что], то [шаг] вырастет с X% до Y%, потому что [причина]». За неделю меняем одно.\n- Вердикт прошлой гипотезы: СРАБОТАЛО / НЕ СРАБОТАЛО / НЕПОНЯТНО (если менялись цена, остатки, реклама, акция или сезон).\n- Меньше 30 переходов за неделю — пишу «данных мало».\n- В кабинете ничего не меняю. Каждая цифра — с источником.\n\n## Отчёт (8 пунктов, коротко)\n1. Итог недели одной строкой. 2. Таблица шагов: эта / прошлая / разница. 3. Где обрыв.\n4. Почему (2–3 причины). 5. Вердикт по прошлой гипотезе с цифрами. 6. Одна гипотеза на неделю.\n7. Что нужно от владельца и до какого дня. 8. Путь к обновлённому файлу."], "notes": [], "start": false}, {"id": "11", "title": "Промпт: недельный отчёт по воронке за 1 минуту чтения", "cat": "Аналитика и финансы", "type": "Промпт", "level": "новичок", "why": "получить понятный отчёт по своей воронке без таблиц на 10 листов.", "when": "", "blocks": ["Вот цифры воронки моих товаров на WB за две недели (эта и прошлая):\n[вставьте таблицу или приложите файл: артикул, переходы, корзина, заказы, выкупы, отмены, рекламные показы и клики, остаток]\n\nПосчитай по каждому артикулу:\n— CTR рекламы = клики / показы;\n— переход → корзина; корзина → заказ;\n— заказ → выкуп = выкупы / (выкупы + отмены);\n— сквозную = выкупы / переходы.\n\nДай отчёт простыми словами:\n1. Итог недели одной строкой.\n2. Таблица: эта неделя / прошлая / разница со стрелкой ↑↓.\n3. На каком ОДНОМ шаге главный обрыв.\n4. 2–3 возможные причины (фото, цена, размеры, отзывы, доставка, остатки).\n5. Одна гипотеза в формате: «Если поменять [что], то [шаг] вырастет с X% до Y%, потому что [причина]».\nЕсли где-то меньше 30 событий — так и напиши: «данных мало»."], "notes": [], "start": false}, {"id": "12", "title": "Одна гипотеза в неделю: журнал тестов", "cat": "Аналитика и финансы", "type": "Шаблон", "level": "новичок", "why": "не путаться, что сработало. Меняем одно — через неделю честно проверяем.", "when": "", "blocks": ["Неделя: [дд.мм–дд.мм]\nКарточка: [артикул]\nЧто меняли: [одно изменение]\nКакой шаг ждали: [например, переход → корзина]\nБыло: [X %]   Стало: [Y %]\nВердикт: СРАБОТАЛО / НЕ СРАБОТАЛО / НЕПОНЯТНО / ЗАПЛАНИРОВАНО\nЧто мешало выводу: [менялись цена, реклама, остатки, акция, сезон]\nРешение: оставить / откатить / новая гипотеза"], "notes": ["- Гипотеза пишется так: «Если поменять [что], то [шаг] вырастет с X% до Y%, потому что [причина]».\n- За неделю — одно изменение на карточку.\n- «Непонятно» — честный вердикт, если параллельно менялось что-то ещё."], "start": false}, {"id": "13", "title": "Агент стратегии: максимум чистой прибыли, а не оборота", "cat": "Аналитика и финансы", "type": "Агент", "level": "профи", "why": "каждый день отвечать на вопрос «что изменить или оставить, чтобы заработать больше чистыми?» и не путать рост заказов с ростом прибыли.", "when": "", "blocks": ["# Агент стратегии прибыли\nЕдинственная цель — максимальная суммарная ЧИСТАЯ прибыль. Не цена, не заказы, не оборот.\nЕжедневный вопрос: «Что сегодня изменить или оставить без изменений, чтобы владелец заработал больше чистыми?»\n\n## Единые определения\n- Цена продавца = после собственной скидки. Цена покупателя = цена продавца × (1 − СПП).\n- Расходы WB = комиссия, эквайринг, хранение, приёмка, штрафы (без логистики и рекламы).\n- Чистая прибыль = Выручка − Расходы WB − Логистика − Обратная логистика − Себестоимость − Налог − Реклама.\n- ДРР по заказам = Реклама / (Заказы шт × Цена продавца).\n- Выкуп % — только по «созревшей» когорте заказов.\n\n## Обязательные правила\n1. Цену дня оцениваю только по когорте заказов этого дня после того, как она созрела (все заказы доехали).\n2. Рост заказов ≠ эффективность. Итог — изменение ОБЩЕЙ чистой прибыли.\n3. Реклама: считаю дополнительные заказы относительно базы без рекламы, а не все заказы периода.\n4. Один тест — один фактор: только цена ИЛИ только бюджет ИЛИ только ставка.\n5. Не предполагаю «дешевле лучше» или «дороже лучше» — ищу цену максимальной общей прибыли по факту.\n6. Один день — сигнал, не доказательство. При меньше 30 заказах расширяю период.\n7. Учитываю день недели, праздники, остатки, акции, СПП, сезон, конкурентов.\n8. Никогда сам не меняю цену, скидку, акции, ставки, бюджеты. Цикл: анализ → ОДИН тест → ожидаемый эффект → согласие → тест → итог.\n\n## Ежедневный отчёт\nЗаканчиваю блоком «РЕКОМЕНДАЦИЯ НА СЕГОДНЯ»: Цена — …, Реклама — …, Причина — …, когда следующее решение."], "notes": [], "start": false}, {"id": "14", "title": "Карточка эксперимента: тест цены или рекламы без хаоса", "cat": "Аналитика и финансы", "type": "Шаблон", "level": "новичок", "why": "перед любым изменением цены или рекламы записать, что именно меняем и когда остановимся. Так тест можно честно оценить.", "when": "", "blocks": ["ЭКСПЕРИМЕНТ\nЧто меняем:\nПочему:\nТекущий показатель:\nНовая настройка:\nЧто оставляем без изменений:\nСколько длится тест:\nКакие показатели смотрим:\nУсловие успеха:\nУсловие остановки:\nСогласие владельца: да / нет"], "notes": ["Попросите агента: «Предложи один тест для [артикул] в формате карточки ЭКСПЕРИМЕНТ. Ничего не меняй, жди моего да»."], "start": false}, {"id": "15", "title": "Промпт: юнит-экономика и чистая прибыль с одной продажи", "cat": "Аналитика и финансы", "type": "Промпт", "level": "новичок", "why": "понять, сколько вы реально зарабатываете с одного проданного товара после всех расходов WB, налога и рекламы.", "when": "", "blocks": ["Посчитай юнит-экономику моего товара на Wildberries.\n\nДанные:\n— цена продавца (после моей скидки): [ ] ₽\n— к перечислению с одной продажи (из еженедельного отчёта WB) или комиссия WB: [ ]\n— себестоимость (закупка + упаковка + доставка до склада): [ ] ₽\n— логистика до покупателя и обратная логистика при отказе: [ ] ₽\n— процент выкупа: [ ] %\n— налог: [ ] % от [чего считается у вас]\n— реклама на один заказ (или ДРР): [ ]\n\nПосчитай:\n1. Чистую прибыль с одной выкупленной продажи.\n2. Чистую прибыль с одного заказа с учётом выкупа и отказов.\n3. При каком выкупе и какой ДРР товар уходит в ноль.\nПокажи расчёт по шагам, каждую формулу. Если каких-то данных нет — спроси, не придумывай."], "notes": [], "start": false}, {"id": "16", "title": "Промпт: разбор рекламы — что она реально добавила", "cat": "Реклама WB", "type": "Промпт", "level": "профи", "why": "понять, сколько заказов дала именно реклама сверх обычных продаж, и окупается ли она в чистой прибыли.", "when": "", "blocks": ["Вот данные по рекламе и продажам моего товара по дням: [приложите файл или таблицу:\nдата, бюджет рекламы, показы, клики, CTR, CPC, заказы всего, цена продавца].\nБыли дни без рекламы / с разным бюджетом: [опишите].\n\n1. Посчитай CTR, CPC, ДРР по заказам = реклама / (заказы × цена продавца).\n2. Сравни заказы в дни без рекламы и с рекламой: сколько ДОПОЛНИТЕЛЬНЫХ заказов дала реклама.\n3. Посчитай, сколько чистой прибыли принесли эти дополнительные заказы минус расход на рекламу.\n4. Сравни уровни бюджета (например, 0 / 500 / 1000 / 1500 ₽ в сутки), где больше чистой прибыли.\n5. Учти, что могли влиять цена, остатки, акции, день недели. Если данных мало (меньше 30 заказов) — так и скажи.\nНичего в рекламном кабинете не меняй. Дай вывод и одно предложение теста в формате карточки ЭКСПЕРИМЕНТ."], "notes": [], "start": false}, {"id": "17", "title": "Агент поиска фабрик (без перекупов)", "cat": "Документы и поставщики", "type": "Агент", "level": "профи", "why": "найти настоящих производителей со своим оборудованием, а не посредников, и иметь запасную фабрику на сезон.", "when": "", "blocks": ["# Агент «Поставщики»\n## Роль\nИщу и проверяю производителей [товар]: фабрики и цеха со своим оборудованием, а не перекупов.\nЦель в деньгах: товар не заканчивается в сезон, закупка не дороже нынешней ([цена] ₽), качество не хуже, есть запасная фабрика.\n\n## Что ищу\n- [описание товара], партии от [N] шт.\n- Плюс, если фабрика умеет Честный знак (наносит коды, шлёт УПД по ЭДО).\n- География: [страны и регионы по приоритету].\n\n## Где ищу\nПоисковики, сайты фабрик, отраслевые каталоги, 2ГИС, Яндекс Карты, выставки.\nПроверка: ИНН и ОКВЭД в открытых реестрах, живое ли юрлицо, фото цеха, оборудование, мощность в месяц.\nЕсли для данных нужна регистрация — пишу владельцу, где именно. Регистрируется и вводит пароли только он.\n\n## Что выдаю\n- Таблицу: название, ИНН, город, сайт, контакты, что производят, признаки производства, мин. партия, цена, ЧЗ, приоритет, комментарий. Лист «Отсеяны» с причиной.\n- Короткий итог: кому звонить первым и почему.\n- Скрипт звонка или письма фабрике.\n\n## Запреты\n- Никому не пишу и не звоню от имени владельца без его «да». Письма — только черновики.\n- Ничего не оплачиваю и не подписываю.\n- ИНН, взятые с сайтов фабрик, помечаю «не проверено в налоговой», пока не проверено."], "notes": [], "start": false}, {"id": "18", "title": "10 вопросов фабрике при первом звонке", "cat": "Документы и поставщики", "type": "Шаблон", "level": "новичок", "why": "за один звонок понять, фабрика это или перекуп, и сможет ли она стабильно отгружать с маркировкой.", "when": "", "blocks": ["1. Вы сами производите или заказываете у других? Сколько у вас оборудования, какое?\n2. Можете сделать нашу модель: [описание + фото]?\n3. Из какого материала и какой состав? Можно повторить наш состав?\n4. Цена за штуку при [100 / 300 / 500] шт? Цена образца?\n5. Минимальная партия на модель и на цвет?\n6. Сколько дней на образец и на партию? Сколько можете делать в месяц в сезон?\n7. Работаете с Честным знаком? Наносите коды сами? Отправляете УПД по ЭДО?\n8. Есть декларация соответствия ЕАЭС на этот товар?\n9. Как оплата (предоплата, сколько %)? Работаете с ИП, есть закрывающие документы?\n10. Как и за сколько доставка до [ваш город]?"], "notes": ["«Подготовь письмо фабрике [название] с этими 10 вопросами, коротко и вежливо. Не отправляй — покажи черновик»."], "start": false}, {"id": "19", "title": "Промпт: проверить поставщика за 10 минут", "cat": "Документы и поставщики", "type": "Промпт", "level": "новичок", "why": "отсеять перекупов и «однодневки» до того, как отправите предоплату.", "when": "", "blocks": ["Проверь поставщика по открытым данным: [название, сайт, ИНН если есть].\n\n1. Живое ли юрлицо, с какого года, основной ОКВЭД — производство или торговля?\n2. Есть ли признаки собственного производства: фото цеха, оборудование, адрес производства, видео?\n3. Отзывы о компании, жалобы, суды (если есть в открытых источниках).\n4. Совпадают ли контакты на сайте, в реестре и на картах.\n5. Итог: «похоже на фабрику / похоже на перекупа / непонятно» и почему, 3–5 пунктов.\nГде данные не удалось проверить — пиши «не проверено». Ни с кем не связывайся и никуда не регистрируйся."], "notes": [], "start": false}, {"id": "20", "title": "Чек-лист «Честный знак» для FBS: 15 минут раз в неделю", "cat": "Честный знак", "type": "Чек-лист", "level": "новичок", "why": "при FBS вы сами выводите каждый проданный код из оборота. WB этого за вас не делает, даже если в выгрузке есть номер чека.", "when": "", "blocks": ["☐ WB → Маркетплейс (FBS) → Завершённые: что выкуплено за неделю.\n☐ Коды этих вещей — ваши и в статусе «В обороте».\n☐ Есть «Вывод из оборота» на каждую дату отгрузки, всё «Обработан успешно».\n☐ Во «Входящих» нет УПД «с ошибками» и «требуется подпись».\n☐ Подписанные черновики удалены."], "notes": ["основа — шпаргалка Гули по ЧЗ для FBS (лёгкая промышленность). Правила меняются — сверяйтесь с официальными статьями ЧЗ и WB.", "«Пройди со мной недельный чек-лист Честного знака по FBS. Возьми выгрузку «Завершённые» и выгрузку кодов из ЧЗ, отметь, что в порядке, а что требует действия. Ничего не подписывай»."], "start": false}, {"id": "21", "title": "Честный знак: вывод из оборота при FBS — пошагово", "cat": "Честный знак", "type": "Инструкция", "level": "новичок", "why": "самое важное действие при FBS. Без него проданные коды висят «в обороте».", "when": "", "blocks": ["ПОДГОТОВКА (один раз)\n- Электронная подпись (УКЭП) на ИП, проверьте срок.\n- КриптоПро CSP + плагин + расширение браузера.\n- Подключена товарная группа «Лёгкая промышленность», есть ЭДО Лайт.\n- МОД в профиле ЧЗ — адрес вашего склада (добавляется по ID ФИАС). Без МОД документ на вывод не заполнить.\n\nПРИЁМКА ОТ ФАБРИКИ\n- Фабрика присылает УПД с кодами, вы подписываете его в ЭДО.\n- Проверьте: ЧЗ → Документы → Входящие → «Обработан успешно». «Подписан» ≠ «принят».\n- Кодов должно быть ровно столько, сколько вещей приехало.\n\nСБОРКА ЗАКАЗА FBS\n- Сканируйте код с той самой вещи, что кладёте в пакет. Код должен быть ваш и «В обороте».\n\nВЫВОД ИЗ ОБОРОТА\nКогда: при отгрузке, до доставки покупателю.\nГде: ЧЗ → Лёгкая промышленность → Документы → Создать → Вывод из оборота.\n  Причина:      «Дистанционная продажа»\n  Дата вывода:  дата отгрузки (один документ на каждый день отгрузки)\n  Место:        ваш МОД\n  Коды:         первые 31 символ: 01 + GTIN + 21 + серийный номер\n  Цена за шт.:  обязательна, берите «Стоимость» из WB\nСохранить черновик → проверить → «Подписать и отправить».\nПотом убедитесь: документ «Обработан успешно», код «Выбыл».\n\nОТКАЗЫ И ВОЗВРАТЫ\n- Вывели код, а покупатель отказался → Создать → Возврат в оборот."], "notes": ["основа — шпаргалка Гули (лёгкая промышленность, октябрь 2026). Не заменяет консультацию юриста; правила меняются."], "start": false}, {"id": "22", "title": "Честный знак при FBS: 7 частых ошибок", "cat": "Честный знак", "type": "Чек-лист", "level": "новичок", "why": "каждая из этих ошибок блокирует продажи или оставляет коды «висеть».", "when": "", "blocks": ["1. «WB сам выведет». При FBS — нет: чек ≠ вывод из оборота.\n2. «Подписан» = «принят». Нет: смотрите статус документа в ЧЗ, нужен «Обработан успешно».\n3. Нет МОД в профиле — документ на вывод не заполнить.\n4. Повторно подписали старый черновик — ошибка «недопустимый статус».\n5. Коды из Excel WB с символом «�» вместо разделителя — берите первые 31 символ.\n6. Кавычка \" или % в коде — вставка не проходит, выбирайте код из списка.\n7. Нет сверки кодов с приходом — лишние коды висят «В обороте»."], "notes": ["ошибки, которые Гуля разобрала в своём магазине (шпаргалка, октябрь 2026).", "«Проверь мои выгрузки WB и ЧЗ на эти 7 ошибок и покажи, где они есть»."], "start": false}, {"id": "23", "title": "Директор-агент: главный над командой агентов", "cat": "Старт с ИИ", "type": "Агент", "level": "профи", "why": "когда агентов много, один «директор» сводит картину, решает порядок и даёт владельцу один короткий итог и 3 шага.", "when": "", "blocks": ["# Директор-агент\n## Что делаю\n1. Собираю картину: отчёты агентов в их папках + сам проверяю цифры (заказы, цены, остатки, акции, воронка) — только чтение.\n2. Решаю, что сейчас важнее всего для чистой прибыли, с учётом ограничений и правила «один тест — один фактор».\n   Если агенты мешают друг другу (например, креатив во время теста цены) — решаю порядок и объясняю владельцу.\n3. Ставлю задачи агентам: что сделать, к какому сроку и как это меняет чистую прибыль.\n4. Даю владельцу один короткий ответ: где мы и 3 следующих шага. Отдельной строкой — что нужно от него (одно «да»/«нет»).\n\n## Что вижу как руководитель продаж\n- Конфликты: акция или реклама во время теста цены; кончился остаток при работающей рекламе; товар без кодов ЧЗ на FBS.\n- План закупки: остаток / заказы в день = дней продаж; сколько и когда заказать, чтобы не обнулиться в сезон.\n\n## Чего не делаю\n- В кабинетах ничего не меняю, не подписываю и не отправляю. Только смотрю.\n- Не подменяю агентов: цифры считает стратегия, коды — агент ЧЗ. Я свожу и решаю порядок.\n- Не беру решения за владельца: деньги, цены, акции, реклама, закупка — только его «да».\n\n## Итог (файл директор/итог.md, перезаписываю)\n# Итог директора на ДД.ММ.ГГГГ\nГде мы: 2–3 строки с цифрами.\n3 шага: что, кто из агентов, к какой дате.\nНужно от владельца: одно-два «да»/«нет»."], "notes": ["директор-агент в команде Гули (в работе)."], "start": false}, {"id": "24", "title": "Промпт: когда и сколько заказать у фабрики", "cat": "Склад и поставки", "type": "Промпт", "level": "новичок", "why": "не обнулиться в сезон и не заморозить деньги в лишнем товаре.", "when": "", "blocks": ["Помоги спланировать закупку.\nДанные по каждому артикулу: остаток на складе WB [ ], остаток на своём складе [ ], заказов в день в среднем за 14 дней [ ],\nсрок производства у фабрики [ ] дней, доставка до склада [ ] дней, приёмка WB [ ] дней, минимальная партия [ ] шт.\nСезон: [когда пик, когда спад].\n\n1. Посчитай, на сколько дней хватит остатка: остаток / заказы в день.\n2. Когда нужно сделать заказ фабрике, чтобы товар приехал до того, как остаток кончится (с запасом 7 дней).\n3. Сколько штук заказать на [N] недель продаж с учётом сезона.\n4. Риски: что будет, если заказы вырастут на 30% или упадут на 30%.\nЕсли данных мало — так и скажи. Ничего никому не отправляй."], "notes": [], "start": false}, {"id": "25", "title": "Промпт: «блок честности» в карточке из жалоб покупателей", "cat": "Карточки и SEO", "type": "Промпт", "level": "новичок", "why": "если покупатели часто пишут «маленькое», «не как на фото», «не для зимы» — это нужно честно сказать в карточке. Так меньше возвратов и плохих отзывов.", "when": "", "blocks": ["Вот отзывы на мой товар за последние [N] месяцев: [вставьте или приложите файл].\n\n1. Найди повторяющиеся жалобы и сомнения (размер, объём, сезон, цвет, качество, швы) и посчитай, сколько раз каждая встречается.\n2. Для топ-3 жалоб напиши, что нужно честно указать в карточке: точные размеры в см, для какого сезона, как выглядит цвет при разном свете.\n3. Предложи текст «блока честности» для описания (5–7 коротких строк) и идею одного слайда инфографики.\n4. Не обещай того, чего нет в данных о товаре. Если чего-то не хватает (например, размеров) — спроси меня.\nНичего в карточке не меняй."], "notes": ["первый шаг плана воронки у Гули: честные размеры, сезон и цвет в карточке."], "start": true}, {"id": "26", "title": "Промпт: ответ на вопрос покупателя в карточке", "cat": "Отзывы и вопросы", "type": "Промпт", "level": "новичок", "why": "вопросы в карточке читают все, кто сомневается. Быстрый точный ответ помогает решиться на заказ.", "when": "", "blocks": ["Ответь на вопрос покупателя в карточке моего товара на WB.\nО товаре: [название, размеры, материал, сезон, уход — то, что точно знаю].\nВопрос: «[текст вопроса]».\n\nПравила:\n— отвечай только по фактам о товаре выше; если ответа в фактах нет — напиши мне, что уточнить, а не придумывай;\n— 1–3 предложения, вежливо, без канцелярита;\n— если вопрос про размер — дай конкретные цифры в см и совет, как выбрать;\n— не обещай сроков доставки и того, что зависит от WB.\nДай 2 варианта ответа."], "notes": [], "start": false}, {"id": "27", "title": "Промпт: первая задача агенту — разбор выгрузки продаж", "cat": "Старт с ИИ", "type": "Промпт", "level": "новичок", "why": "хороший первый шаг с агентом: он сам открывает вашу выгрузку и кладёт готовую сводку, а не объясняет, как сделать в Excel.", "when": "", "blocks": ["В папке лежит выгрузка продаж из кабинета WB: [имя файла].\n1. Открой её и разберись, какие там столбцы.\n2. Посчитай за период: сколько заказов и выкупов по каждому артикулу, выручку, средний чек.\n3. Покажи топ-5 товаров, которые принесли больше всего денег, и 5 самых слабых.\n4. Сохрани результат в таблицу сводка_[дата].xlsx в эту же папку.\n5. В конце — 3 вывода простыми словами.\nИсходный файл не меняй."], "notes": [], "start": true}, {"id": "28", "title": "Промпт: ТЗ дизайнеру на инфографику карточки", "cat": "Контент и визуал", "type": "Промпт", "level": "новичок", "why": "получить понятное ТЗ на слайды карточки, основанное на том, что реально волнует покупателей.", "when": "", "blocks": ["Составь ТЗ дизайнеру на [N] слайдов инфографики для товара на WB.\nТовар: [название, преимущества, размеры, материал, сезон].\nЧастые вопросы и жалобы покупателей: [из отзывов и вопросов].\nГлавные конкуренты (что у них на первом слайде): [если знаете].\n\nДля каждого слайда:\n— задача слайда (что покупатель должен понять за 2 секунды);\n— заголовок до 5 слов;\n— 2–3 подписи;\n— что на фото/иллюстрации;\n— чего НЕ писать (обещаний, которые товар не выполняет).\nПервый слайд — для клика в выдаче, следующие — снимают сомнения из отзывов."], "notes": ["у Гули воронка передаёт ТЗ креативному директору; Гуля сама работала дизайнером карточек."], "start": false}, {"id": "29", "title": "Лента передач: как агенты передают работу друг другу", "cat": "Старт с ИИ", "type": "Шаблон", "level": "профи", "why": "когда агентов несколько, каждый пишет одну строку о сделанном в общий файл. Новый агент читает хвост ленты и сразу в курсе, без пересказов.", "when": "", "blocks": ["## Передача работы\nРезультат — файл с датой ГГГГ-ММ-ДД_<коротко>.md в своей папке + строка в конец лента.md:\nГГГГ-ММ-ДД ЧЧ:ММ | от кого → кому | что сделано | путь к файлу\nНе хватает данных — пишу «→ владельцу: нужно …», не додумываю.\nЧитать ленту — только последние 10 строк, не весь файл.\n\nПример строки:\n2026-11-03 19:45 | воронка → стратегия | гипотеза недели: блок честности на карточке | воронка/2026-11-03_гипотеза.md"], "notes": ["так работают все проекты Гули (файл лента.md)."], "start": false}, {"id": "30", "title": "Промпт: название карточки, которое находят в поиске", "cat": "Карточки и SEO", "type": "Промпт", "level": "новичок", "why": "название влияет на то, по каким запросам вас находят и кликают ли на карточку.", "when": "создаёте новую карточку или карточка плохо находится по главным запросам.", "blocks": ["Помоги составить название карточки для Wildberries.\nТовар: [что это, для кого, главное свойство, материал, сезон].\nГлавные запросы покупателей (из подсказок поиска WB или сервиса аналитики): [список].\nПравила площадки по длине названия: [вставьте актуальное ограничение из справки WB].\n\n1. Дай 5 вариантов названия: главный запрос в начале, без повторов слов, без капслока и «лучший/хит».\n2. Для каждого варианта — какие запросы он покрывает.\n3. Отметь, какие слова лучше перенести в характеристики или описание.\nНе придумывай свойства, которых нет в описании товара."], "notes": [], "start": false}, {"id": "31", "title": "Промпт: описание карточки без «воды»", "cat": "Карточки и SEO", "type": "Промпт", "level": "новичок", "why": "описание отвечает на вопросы покупателя и добавляет запросы, по которым карточку находят.", "when": "описание пустое, шаблонное или в отзывах повторяются одни и те же вопросы.", "blocks": ["Напиши описание товара для Wildberries.\nФакты о товаре: [материал, размеры в см, сезон, уход, комплектация, страна].\nЧастые вопросы и жалобы из отзывов: [список].\nЗапросы, которые нужно естественно включить: [список].\n\nСтруктура: 1) кому и для чего, 2) чем отличается, 3) размеры и как выбрать, 4) уход, 5) честные ограничения (сезон, посадка).\nПиши короткими абзацами, без канцелярита и обещаний, которых нет в фактах. Уложись в лимит знаков WB: [лимит]."], "notes": [], "start": false}, {"id": "32", "title": "Промпт: собрать и разложить ключевые запросы", "cat": "Карточки и SEO", "type": "Промпт", "level": "профи", "why": "понять, какие запросы обязательно должны быть в названии, а какие — в описании и характеристиках.", "when": "перед заполнением карточки или когда карточка теряет позиции.", "blocks": ["Вот список поисковых запросов по моему товару с частотностью (из сервиса аналитики или подсказок WB): [вставьте таблицу].\n1. Убери запросы, которые не про мой товар (другой тип, пол, сезон).\n2. Сгруппируй оставшиеся по смыслу (кластеры).\n3. Для каждого кластера реши: название / описание / характеристики.\n4. Отметь запросы, где у меня нет нужного слова в карточке.\nСохрани результат в таблицу запросы_[дата].xlsx. Частотность не придумывай — используй только данные из файла."], "notes": [], "start": false}, {"id": "33", "title": "Промпт: проверка характеристик карточки", "cat": "Карточки и SEO", "type": "Промпт", "level": "новичок", "why": "характеристики влияют на фильтры: если поле пустое, товар не попадает в выдачу по фильтру.", "when": "после создания карточки и раз в месяц: WB добавляет новые поля.", "blocks": ["Вот выгрузка характеристик моей карточки (или скопированный список полей): [вставьте].\nФакты о товаре: [вставьте].\n1. Найди пустые поля, которые можно заполнить по фактам.\n2. Найди поля, где значение спорное или не совпадает с фактами.\n3. Подскажи, какие поля важны для фильтров покупателя в моей категории.\nНичего не меняй в кабинете — дай список правок, я внесу сама."], "notes": [], "start": false}, {"id": "34", "title": "Промпт: разбор слабой карточки по шагам воронки", "cat": "Карточки и SEO", "type": "Промпт", "level": "профи", "why": "понять, что именно мешает карточке продавать: клик, корзина, заказ или выкуп.", "when": "у карточки есть переходы, но мало заказов, или заказы есть, но низкий выкуп.", "blocks": ["Разбери мою карточку. Данные воронки за 2 недели: [переходы, корзина, заказы, выкупы, отмены].\nСсылка или описание карточки: [главное фото, слайды, название, цена, рейтинг, число отзывов].\nОтзывы за последние месяцы: [вставьте].\n\n1. Найди шаг воронки с главной потерей.\n2. Назови 3 вероятные причины, связанные с карточкой (фото, описание, размеры, отзывы, цена).\n3. Предложи ОДНО изменение на неделю в формате: «Если поменять [что], то [шаг] вырастет, потому что [причина]».\nЕсли данных меньше 30 событий — напиши «данных мало»."], "notes": [], "start": false}, {"id": "35", "title": "Шаблон: план изменений карточки «до → после»", "cat": "Карточки и SEO", "type": "Шаблон", "level": "новичок", "why": "записать, что было и что меняем, чтобы потом честно сравнить результат.", "when": "перед любым изменением карточки.", "blocks": ["Карточка: [артикул]   Дата изменения: [дата]\nЧто меняем (одно): [главное фото / название / описание / слайд №…]\nБЫЛО: [описание или скрин]\nСТАЛО: [описание или скрин]\nКакой шаг воронки ждём: [переход / корзина / заказ / выкуп]\nЦифры до (2 недели): [ ]   Цифры после (2 недели): [ ]\nЧто ещё менялось в эти даты (цена, реклама, остатки, акции): [ ]\nВывод: сработало / не сработало / непонятно"], "notes": [], "start": false}, {"id": "36", "title": "Промпт: сравнить свою карточку с топом выдачи", "cat": "Карточки и SEO", "type": "Промпт", "level": "новичок", "why": "увидеть, чем карточки из топа выдачи отличаются от вашей: фото, цена, отзывы, название.", "when": "перед редизайном карточки или когда упали переходы.", "blocks": ["Вот данные по 10 карточкам из выдачи по запросу «[запрос]» и по моей карточке:\n[для каждой: позиция, цена, рейтинг, отзывов, что на главном фото, название, есть ли видео].\n1. Сделай таблицу сравнения.\n2. Что общего у карточек выше моей?\n3. 3 отличия моей карточки, которые могут мешать клику.\nТолько по данным из таблицы, без догадок о продажах конкурентов."], "notes": [], "start": false}, {"id": "37", "title": "Шаблон: A/B-тест главного фото", "cat": "Карточки и SEO", "type": "Шаблон", "level": "профи", "why": "главное фото решает, кликнут ли на карточку в выдаче. Тест показывает, какое фото работает лучше.", "when": "когда есть 2 варианта главного фото и стабильные переходы.", "blocks": ["Карточка: [артикул]\nВариант А: [описание фото]   Вариант Б: [описание фото]\nЧто проверяем: переход в карточку (CTR) / корзина\nКак проводим: [инструмент WB для тестов фото, если доступен в вашем кабинете, или по неделям: неделя А, неделя Б]\nЧто не меняем в это время: цену, рекламу, акции, остальные слайды\nМинимум данных для вывода: [не меньше 30 переходов на вариант]\nИтог: А / Б / разницы нет"], "notes": [], "start": false}, {"id": "38", "title": "Промпт: структура слайдов карточки", "cat": "Карточки и SEO", "type": "Промпт", "level": "новичок", "why": "каждый слайд снимает одно сомнение покупателя, а не повторяет предыдущий.", "when": "делаете новую инфографику или переделываете старую.", "blocks": ["Предложи структуру из [N] слайдов для карточки товара [товар].\nСомнения покупателей из отзывов и вопросов: [список].\nДля каждого слайда: задача, заголовок до 5 слов, что на картинке.\nСлайд 1 — для клика в выдаче. Следующие — по одному сомнению. Последний — размеры или уход.\nНе пиши обещаний, которых нет в фактах о товаре: [факты]."], "notes": [], "start": false}, {"id": "39", "title": "Промпт: сценарий видео для карточки на 10–15 секунд", "cat": "Карточки и SEO", "type": "Промпт", "level": "новичок", "why": "видео в карточке показывает товар в жизни: посадку, размер, фактуру.", "when": "у карточки нет видео или старое видео не показывает главное.", "blocks": ["Напиши сценарий короткого видео для карточки WB (10–15 секунд, без звука).\nТовар: [что, главное свойство, частые вопросы покупателей].\nПокадрово: секунда — что в кадре — крупно/общий план.\nПервые 2 секунды — самое главное свойство. Показать: [посадку / размер / фактуру / как работает].\nТекста в кадре минимум. Ничего, что товар не умеет."], "notes": [], "start": false}, {"id": "40", "title": "Промпт: план поставки на склады WB", "cat": "Склад и поставки", "type": "Промпт", "level": "профи", "why": "распределить товар по складам так, чтобы доставка была быстрее, а товар не застревал.", "when": "перед каждой поставкой FBO.", "blocks": ["Данные: остатки по складам WB [таблица], заказы по регионам за 30 дней [таблица], сколько штук готово к отправке [N].\n1. Посчитай, на сколько дней хватит остатка на каждом складе.\n2. Предложи распределение новой поставки по складам с учётом заказов по регионам.\n3. Отметь склады, куда сейчас везти не стоит (много остатка).\nКоэффициенты приёмки и лимиты складов смотрю в кабинете сама — учти их, если я вставлю: [коэффициенты]."], "notes": [], "start": false}, {"id": "41", "title": "Промпт: оборачиваемость и «залежавшийся» товар", "cat": "Склад и поставки", "type": "Промпт", "level": "новичок", "why": "увидеть, какой товар лежит слишком долго и съедает деньги на хранении.", "when": "раз в месяц или перед новой закупкой.", "blocks": ["Вот остатки и продажи по артикулам за 30 дней: [таблица: артикул, остаток, продано шт, хранение ₽].\n1. Посчитай оборачиваемость в днях: остаток / продажи в день.\n2. Отсортируй от самого медленного.\n3. Для медленных предложи варианты: акция, перераспределение, остановить закупку. Решение за мной."], "notes": [], "start": false}, {"id": "42", "title": "Промпт: почему возвращают товар", "cat": "Склад и поставки", "type": "Промпт", "level": "новичок", "why": "возвраты — это двойная логистика и потеря денег. Нужно понять причину.", "when": "если выкуп падает или в отчёте много возвратов.", "blocks": ["Вот возвраты и отказы за период: [таблица из отчёта WB] и отзывы с низкими оценками: [вставьте].\n1. Сгруппируй причины: размер, качество, не как на фото, долгая доставка, другое.\n2. Какие причины можно снять карточкой (размеры, фото, блок честности), а какие — качеством товара.\n3. Одно действие на неделю."], "notes": [], "start": false}, {"id": "43", "title": "Шаблон: FBO или FBS — как выбрать", "cat": "Склад и поставки", "type": "Схема", "level": "новичок", "why": "понять, где хранить товар: на складе WB или у себя, с учётом маркировки и денег.", "when": "перед запуском товара или при смене схемы.", "blocks": ["FBO (склад WB): быстрее доставка покупателю, но платное хранение и приёмка; поставки по правилам складов.\nFBS (свой склад): товар у вас, вы собираете каждый заказ; при маркировке сами выводите коды из оборота в Честном знаке.\n\nОтветьте на вопросы:\n1. Сколько заказов в день и успеваю ли собирать их сама?\n2. Есть ли маркировка? (при FBS — вывод из оборота на каждую продажу)\n3. Сколько стоит хранение на WB по моему товару? (смотрю в отчётах)\n4. Насколько важна скорость доставки в моей категории?"], "notes": ["Попросите агента: «Сравни FBO и FBS для моего товара по моим данным: [вставьте]» — пусть посчитает расходы по обеим схемам."], "start": false}, {"id": "44", "title": "Чек-лист: поставка на склад WB", "cat": "Склад и поставки", "type": "Чек-лист", "level": "новичок", "why": "не потерять товар и деньги на приёмке из-за ошибок в упаковке и документах.", "when": "перед каждой поставкой FBO.", "blocks": ["☐ Выбран склад и дата, проверен коэффициент приёмки в кабинете.\n☐ Создана поставка в кабинете, количество совпадает с фактом.\n☐ Каждый товар с баркодом, коробки с этикетками короба.\n☐ Маркированный товар — коды за вами и в обороте.\n☐ Упаковка по требованиям WB для категории.\n☐ Пропуск/время доставки согласованы.\n☐ После приёмки сверить принятое количество с отправленным."], "notes": ["Требования WB меняются — сверяйтесь с актуальной справкой в кабинете."], "start": false}, {"id": "45", "title": "Чек-лист: приёмка товара от фабрики", "cat": "Склад и поставки", "type": "Чек-лист", "level": "новичок", "why": "брак и пересорт лучше найти до того, как товар уедет к покупателю.", "when": "каждый раз, когда приходит партия.", "blocks": ["☐ Количество по каждому артикулу и цвету совпадает с документом.\n☐ Выборочно проверить качество: швы, размер, цвет, запах.\n☐ Маркированный товар: УПД с кодами подписан, статус в ЧЗ «Обработан успешно», кодов ровно столько, сколько вещей.\n☐ Брак сфотографирован и отложен, фабрике отправлена претензия.\n☐ Остатки внесены в учёт."], "notes": [], "start": false}, {"id": "46", "title": "Что делать с браком: пошагово", "cat": "Склад и поставки", "type": "Инструкция", "level": "новичок", "why": "чтобы брак не дошёл до покупателя и не превратился в плохой отзыв.", "when": "нашли брак в партии или пришёл отзыв о браке.", "blocks": ["1. Отделить бракованные единицы, сфотографировать дефект и бирку.\n2. Посчитать количество и процент брака в партии.\n3. Отправить фабрике претензию (шаблон «Претензия поставщику по браку»).\n4. Если товар маркирован — решить с фабрикой, что делать с кодами.\n5. Если брак дошёл до покупателя — ответить на отзыв спокойно, без спора, и передать жалобу в отчёт для фабрики.\n6. Записать случай в журнал: дата, партия, дефект, решение.", "Вот фото и описание брака: [описание], партия [дата, количество].\nСоставь претензию фабрике: что не так, сколько единиц, что просим (замена / скидка / возврат). Не отправляй — покажи черновик."], "notes": ["Промпт для агента:"], "start": false}, {"id": "47", "title": "Промпт: учесть сезонность в закупке", "cat": "Склад и поставки", "type": "Промпт", "level": "профи", "why": "сезонный товар нельзя закупать «как в прошлом месяце»: в пик его не хватит, в спад он зависнет.", "when": "за 1–2 месяца до начала и конца сезона.", "blocks": ["Мой товар сезонный: [какой сезон, когда пик]. Продажи по неделям за прошлый сезон: [таблица, если есть].\nСейчас: остаток [ ], заказов в день [ ], срок производства и доставки [ ] дней.\n1. Когда начнётся рост и спад спроса по моим данным.\n2. Когда заказать последнюю партию, чтобы не остаться с остатком после сезона.\n3. Риски, если сезон начнётся раньше или позже.\nЕсли прошлых данных нет — так и скажи, не придумывай."], "notes": [], "start": false}, {"id": "48", "title": "Промпт: сценарий рилса про товар или работу", "cat": "Контент и визуал", "type": "Промпт", "level": "новичок", "why": "короткое видео с крючком в первые секунды и понятным призывом в конце.", "when": "готовите рилс для Instagram, ВК или TikTok.", "blocks": ["Напиши сценарий рилса на 30–45 секунд. Тема: [тема]. Аудитория: [кто смотрит].\nСтруктура: крючок на 2 секунды (фраза + текст на экране до 7 слов) → 3 коротких смысловых блока → вывод → призыв: [что сделать зрителю].\nРаспиши по секундам: что в кадре, что говорю, какой текст поверх.\nБез обещаний результата и выдуманных цифр."], "notes": [], "start": false}, {"id": "49", "title": "Промпт: ТЗ для нейрофотосессии товара", "cat": "Контент и визуал", "type": "Промпт", "level": "профи", "why": "получить фото товара в разных сценах без дорогой съёмки.", "when": "нужны новые фото для карточки или рекламы.", "blocks": ["Составь ТЗ для генерации фото товара: [товар, цвет, материал].\nНужно [N] сцен: [где и как используется товар, сезон, кто модель].\nДля каждой сцены: фон, свет, ракурс, настроение, что обязательно видно (фактура, посадка), чего не должно быть.\nТовар должен выглядеть как на реальном фото, без изменения формы и цвета: [приложите исходное фото]."], "notes": [], "start": false}, {"id": "50", "title": "Промпт: подпись к посту с призывом", "cat": "Контент и визуал", "type": "Промпт", "level": "новичок", "why": "подпись, которую дочитывают и на которую отвечают.", "when": "публикуете пост или рилс.", "blocks": ["Напиши подпись к посту. Тема: [тема]. Площадка: [Instagram / Telegram / ВК].\nПервая строка — крючок. Дальше 3–5 коротких абзацев. В конце — одно действие в один клик: [опрос / реакция / кодовое слово].\nБез канцелярита, без «не упустите шанс». Для Instagram добавь 5–8 хэштегов."], "notes": [], "start": false}, {"id": "51", "title": "Промпт: пост для Telegram-канала", "cat": "Контент и визуал", "type": "Промпт", "level": "новичок", "why": "регулярные полезные посты, которые разогревают подписчиков.", "when": "ведёте канал о своём бренде или экспертизе.", "blocks": ["Напиши пост для Telegram-канала. Тема: [тема]. Мой опыт по теме: [факты, без цифр, которых нет].\nФормат: заголовок жирным, 4–6 коротких абзацев, один пример из практики, вывод.\nВ конце — опрос на 3–4 варианта или просьба поставить реакцию."], "notes": [], "start": false}, {"id": "52", "title": "Промпт: ТЗ фотографу на съёмку товара", "cat": "Контент и визуал", "type": "Промпт", "level": "новичок", "why": "фотограф снимает то, что нужно карточке, а не «красиво вообще».", "when": "планируете съёмку.", "blocks": ["Составь ТЗ фотографу. Товар: [что, цвета, размеры]. Нужны фото для: [главное фото, слайды, реклама].\nСписок кадров: что снять, ракурс, фон, модель или предметная съёмка.\nОбязательные кадры: посадка/размер, фактура крупно, все цвета.\nФормат и размер файлов для WB: [актуальные требования из справки]."], "notes": [], "start": false}, {"id": "53", "title": "Промпт: контент-план на неделю", "cat": "Контент и визуал", "type": "Промпт", "level": "новичок", "why": "не придумывать каждый день с нуля, что публиковать.", "when": "в начале недели.", "blocks": ["Составь контент-план на 7 дней для [площадки]. Тема аккаунта: [ ]. Цель: [ ].\nКаждый день: формат (рилс / карусель / пост / сторис), тема, крючок, призыв.\nЧередуй: польза, личный опыт, ответ на частый вопрос, показ работы, вовлечение (опрос).\nБез обещаний результата."], "notes": [], "start": false}, {"id": "54", "title": "Промпт: карусель на 7 слайдов", "cat": "Контент и визуал", "type": "Промпт", "level": "новичок", "why": "карусель сохраняют и пересылают — это хороший охват.", "when": "хотите объяснить тему по шагам.", "blocks": ["Сделай текст карусели на 7 слайдов. Тема: [ ].\nСлайд 1 — обложка с крючком. Слайды 2–6 — по одной мысли, 1–2 предложения. Слайд 7 — вывод и призыв: [ ].\nПиши крупными короткими фразами, чтобы читалось с телефона."], "notes": [], "start": false}, {"id": "55", "title": "Шаблон: рубрики для канала селлера", "cat": "Контент и визуал", "type": "Шаблон", "level": "новичок", "why": "рубрики помогают не выгорать: каждую неделю понятно, что писать.", "when": "запускаете или перезапускаете канал.", "blocks": ["Понедельник — «Разбор»: одна задача магазина и как её решили.\nВторник — «Экран»: короткое видео, как агент/инструмент делает работу.\nСреда — «Вопрос — ответ»: из комментариев и личных сообщений.\nЧетверг — «Ошибка»: что пошло не так и вывод.\nПятница — «Опрос»: одно нажатие для подписчиков.\nВыходные — личное / закулисье."], "notes": [], "start": false}, {"id": "56", "title": "Промпт: найти минус-фразы", "cat": "Реклама WB", "type": "Промпт", "level": "профи", "why": "отключить показы по запросам, которые не про ваш товар и тратят бюджет.", "when": "раз в неделю по каждой активной кампании.", "blocks": ["Вот статистика кластеров/фраз рекламной кампании за 7–14 дней: [таблица: фраза, показы, клики, CTR, заказы, расход].\nМой товар: [что это, для кого, сезон].\n1. Найди фразы не про мой товар (другой тип, пол, сезон, бренд).\n2. Найди фразы с расходом без заказов при достаточном числе кликов.\n3. Дай список кандидатов в минус-фразы с причиной. Решение за мной, в кабинете ничего не меняй."], "notes": [], "start": false}, {"id": "57", "title": "Промпт: проверить ставки рекламы", "cat": "Реклама WB", "type": "Промпт", "level": "профи", "why": "понять, где ставка завышена, а где из-за низкой ставки нет показов.", "when": "после запуска кампании и раз в неделю.", "blocks": ["Данные кампании по дням: [ставка, показы, CTR, CPC, корзины, заказы, расход], цена продавца [ ], чистая прибыль с заказа [ ].\n1. Посчитай стоимость заказа и ДРР.\n2. Сравни с прибылью с заказа: где реклама съедает прибыль.\n3. Предложи одно изменение ставки как тест (карточка ЭКСПЕРИМЕНТ). Ничего не меняй сам."], "notes": [], "start": false}, {"id": "58", "title": "Промпт: какие кампании отключить", "cat": "Реклама WB", "type": "Промпт", "level": "профи", "why": "найти кампании, которые тратят деньги и не приносят прибыль.", "when": "раз в неделю или когда растёт ДРР.", "blocks": ["Вот все рекламные кампании за 14 дней: [таблица: кампания, артикул, расход, заказы, ДРР].\nЧистая прибыль с заказа по артикулам: [ ]. Остатки по артикулам: [ ].\n1. Кампании с расходом без заказов.\n2. Кампании, где реклама на заказ дороже прибыли с заказа.\n3. Кампании на товар с заканчивающимся остатком.\nДай список «проверить/остановить» с причиной. Решение и действия — за мной."], "notes": [], "start": false}, {"id": "59", "title": "Промпт: утренний отчёт по рекламе", "cat": "Реклама WB", "type": "Промпт", "level": "новичок", "why": "за минуту понять, что вчера произошло с рекламой.", "when": "каждое утро.", "blocks": ["Вот статистика рекламы за вчера и за тот же день прошлой недели: [таблица].\nОтчёт в 5 строк: расход, заказы, ДРР, что изменилось сильнее всего, что проверить сегодня.\nЕсли данных мало для вывода — так и напиши."], "notes": [], "start": false}, {"id": "60", "title": "Поиск или каталог: где показывается реклама", "cat": "Реклама WB", "type": "Схема", "level": "новичок", "why": "реклама в поиске и в каталоге работает по-разному, и сравнивать их нужно отдельно.", "when": "настраиваете или анализируете кампании.", "blocks": ["Поиск: показы по запросам покупателей → важны фразы, минус-фразы, релевантность названия.\nКаталог/рекомендации: показы по категории и похожим товарам → важны главное фото и цена.\n\nДля каждой площадки показа отдельно смотрите: CTR, стоимость клика, корзины, заказы, ДРР.\nНе делайте вывод «реклама не работает» по сумме — смотрите, где именно не работает."], "notes": ["Типы кампаний и их настройки WB меняет — сверяйтесь с актуальной справкой в кабинете продвижения."], "start": false}, {"id": "61", "title": "Агент рекламы: ежедневный отчёт в Telegram", "cat": "Реклама WB", "type": "Агент", "level": "профи", "why": "каждое утро получать короткий отчёт по рекламе, не заходя в кабинет.", "when": "когда кампаний больше одной и нет времени смотреть каждый день.", "blocks": ["# Агент рекламы\nКаждое утро беру статистику рекламы за вчера (только чтение) и присылаю отчёт:\nрасход, показы, CTR, CPC, заказы, ДРР по кампаниям; что изменилось против того же дня прошлой недели; что проверить.\nСтавки, бюджеты и кампании НЕ меняю — только предлагаю, после «да» владельца.\nМеньше 30 заказов — пишу «данных мало», без категоричных выводов."], "notes": [], "start": false}, {"id": "62", "title": "Промпт: посчитать ДРР и предельную ставку", "cat": "Реклама WB", "type": "Промпт", "level": "новичок", "why": "понять, сколько максимум можно тратить на рекламу на один заказ, чтобы остаться в плюсе.", "when": "перед запуском рекламы на новый товар.", "blocks": ["Цена продавца [ ], чистая прибыль с выкупленной продажи без рекламы [ ], выкуп [ ] %.\n1. Посчитай чистую прибыль с заказа с учётом выкупа.\n2. Какой расход на рекламу на один заказ съедает всю прибыль.\n3. Какой ДРР это соответствует. Покажи формулы."], "notes": [], "start": false}, {"id": "63", "title": "Промпт: разобрать кластеры запросов в рекламе", "cat": "Реклама WB", "type": "Промпт", "level": "профи", "why": "понять, какие группы запросов приносят заказы, а какие только показы.", "when": "раз в 1–2 недели по поисковым кампаниям.", "blocks": ["Вот статистика по кластерам запросов кампании: [таблица].\n1. Отсортируй кластеры по заказам и по расходу.\n2. Кластеры «много показов — мало кликов»: что не так с фото или названием для этих запросов.\n3. Кластеры «клики есть — заказов нет»: возможно, запрос не про мой товар.\nВыводы и список к проверке. В кабинете ничего не меняй."], "notes": [], "start": false}, {"id": "64", "title": "Честный знак: приёмка товара от фабрики", "cat": "Честный знак", "type": "Чек-лист", "level": "новичок", "why": "если приёмка в ЧЗ прошла с ошибкой, коды остаются у фабрики, и продавать товар нельзя.", "when": "каждый раз при поступлении маркированного товара.", "blocks": ["☐ Фабрика прислала УПД с кодами в ЭДО.\n☐ Количество кодов = количество вещей.\n☐ УПД подписан вами.\n☐ ЧЗ → Документы → Входящие: статус «Обработан успешно» (не просто «подписан»).\n☐ Выборочно: коды числятся за вами и «В обороте».\n☐ Если «Обработан с ошибками» — коды не ваши, связаться с фабрикой до продажи."], "notes": ["Основа: шпаргалка Гули по ЧЗ для FBS. Правила меняются — сверяйтесь с официальными статьями ЧЗ."], "start": false}, {"id": "65", "title": "Честный знак: отказы и возвраты при FBS", "cat": "Честный знак", "type": "Инструкция", "level": "новичок", "why": "если код уже выведен, а покупатель отказался, его нужно вернуть в оборот, иначе товар не продать снова.", "when": "при каждом отказе по FBS после вывода из оборота.", "blocks": ["1. Найти код вещи, по которой отказ.\n2. ЧЗ → Документы → Создать → Возврат в оборот.\n3. Указать причину и код, подписать.\n4. Проверить: код снова «В обороте».\n5. Учесть, что отказы по FBS часто уезжают на склад WB и продаются уже оттуда.", "Вот список отказов FBS за неделю: [таблица]. Найди их коды в выгрузке ЧЗ и покажи, какие нужно вернуть в оборот. Ничего не подписывай."], "notes": ["Промпт для агента:", "Основа: шпаргалка Гули. Сверяйтесь с актуальными инструкциями ЧЗ."], "start": false}, {"id": "66", "title": "Честный знак: УПД «Обработан с ошибками» — что делать", "cat": "Честный знак", "type": "Инструкция", "level": "профи", "why": "даже несколько плохих кодов блокируют весь документ, и коды остаются у отправителя.", "when": "увидели статус «Обработан с ошибками».", "blocks": ["1. Открыть документ и посмотреть, какие коды с ошибкой и какая ошибка.\n2. Проверить каждый код в разделе кодов: чей он и в каком статусе.\n3. Если коды не переданы фабрикой корректно — написать фабрике, приложить список кодов и текст ошибки.\n4. Фабрика отправляет новый/исправленный документ, вы подписываете.\n5. Проверить статус «Обработан успешно».\n6. До исправления эти вещи не продавать — по ним нельзя будет вывести коды.", "Вот текст ошибки и список кодов из УПД: [вставьте]. Составь письмо фабрике, что исправить. Не отправляй."], "notes": ["Промпт для агента:"], "start": false}, {"id": "67", "title": "Честный знак: как добавить МОД (адрес склада)", "cat": "Честный знак", "type": "Инструкция", "level": "новичок", "why": "без МОД (места осуществления деятельности) нельзя заполнить документ на вывод из оборота.", "when": "при первой настройке ЧЗ или смене адреса склада.", "blocks": ["1. Найти свой адрес в ФИАС (fias.nalog.ru) и скопировать ID ФИАС дома.\n2. Профиль в ЧЗ → Места осуществления деятельности → Добавить.\n3. Вставить ID ФИАС, сохранить, подписать если требуется.\n4. Проверить, что МОД появился в списке и выбирается в документе вывода из оборота."], "notes": ["Основа: шпаргалка Гули. Интерфейс ЧЗ меняется — ориентируйтесь на названия разделов в вашем кабинете."], "start": false}, {"id": "68", "title": "Промпт: сверка прихода кодов с фактом", "cat": "Честный знак", "type": "Промпт", "level": "новичок", "why": "лишние или недостающие коды потом превращаются в ошибки при выводе и расхождения в учёте.", "when": "после каждой приёмки маркированной партии.", "blocks": ["Вот коды из УПД фабрики: [файл] и фактический пересчёт товара по артикулам и цветам: [таблица].\n1. Сравни количество кодов и вещей по каждому артикулу и цвету.\n2. Покажи лишние коды и недостающие.\n3. Проверь в выгрузке ЧЗ, что все коды за мной и «В обороте».\nИтог одной строкой и список, что написать фабрике. Ничего не подписывай."], "notes": [], "start": false}, {"id": "69", "title": "Промпт: ответ на негативный отзыв", "cat": "Отзывы и вопросы", "type": "Промпт", "level": "новичок", "why": "спокойный ответ на негатив показывает будущим покупателям, что продавцу не всё равно.", "when": "пришёл отзыв 1–3★.", "blocks": ["Отзыв: «[текст]», оценка [ ]. Факты о товаре: [ ].\n1. Что на самом деле не понравилось покупателю.\n2. Есть ли в этом наша ошибка или это особенность товара.\n3. Два варианта ответа: признаём, объясняем, предлагаем решение. Без спора, без обвинений, без просьб прислать фото.\n4. Нужно ли что-то поменять в карточке, чтобы такие отзывы не повторялись."], "notes": [], "start": false}, {"id": "70", "title": "Промпт: частые вопросы → ответы в карточке", "cat": "Отзывы и вопросы", "type": "Промпт", "level": "новичок", "why": "если один вопрос задают много раз, ответ должен быть в карточке.", "when": "раз в месяц.", "blocks": ["Вот вопросы покупателей из карточки за 1–3 месяца: [вставьте].\n1. Сгруппируй повторяющиеся вопросы и посчитай, сколько раз каждый задан.\n2. Для топ-5 напиши, куда добавить ответ: название, описание, характеристики или слайд.\n3. Готовый текст ответа для каждого."], "notes": [], "start": false}, {"id": "71", "title": "Шаблон: журнал ответов на отзывы", "cat": "Отзывы и вопросы", "type": "Шаблон", "level": "новичок", "why": "агент учится на ваших правках, а вы видите, что уже отвечено.", "when": "если отвечаете на отзывы с помощью агента.", "blocks": ["| Дата | ID отзыва | Оценка | Суть отзыва | Ответ | Кто одобрил | Правка владельца |\n|---|---|---|---|---|---|---|"], "notes": ["Правило: каждую правку владельца агент записывает и в журнал, и в файл стиля, с выводом «как теперь отвечаем»."], "start": false}, {"id": "72", "title": "Промпт: недельный отчёт по отзывам", "cat": "Отзывы и вопросы", "type": "Промпт", "level": "новичок", "why": "видеть тренд: что хвалят, на что жалуются, что изменилось.", "when": "раз в неделю.", "blocks": ["Вот отзывы за неделю: [вставьте]. За прошлую неделю: [вставьте].\n1. Средняя оценка и число отзывов: эта / прошлая неделя.\n2. Что хвалят (топ-3), на что жалуются (топ-3).\n3. Новые жалобы, которых раньше не было.\n4. Что передать в карточку, а что — поставщику."], "notes": [], "start": false}, {"id": "73", "title": "Шаблон: запрос коммерческого предложения", "cat": "Документы и поставщики", "type": "Шаблон", "level": "новичок", "why": "одинаковый запрос всем фабрикам — легко сравнить ответы.", "when": "ищете новую фабрику.", "blocks": ["Здравствуйте! Я селлер на Wildberries, ищу производителя [товар].\nМодель: [описание, фото во вложении]. Материал: [ ]. Цвета: [ ].\nОбъём: [100 / 300 / 500] шт на модель, регулярно по сезону.\nПрошу сообщить: цену за штуку при этих объёмах, цену и срок образца, срок партии, мин. партию,\nработаете ли с Честным знаком (коды, УПД по ЭДО), есть ли декларация ЕАЭС, условия оплаты и доставки до [город].\nСпасибо!"], "notes": ["Агент готовит письмо как черновик. Отправляете вы."], "start": false}, {"id": "74", "title": "Шаблон: претензия поставщику по браку", "cat": "Документы и поставщики", "type": "Шаблон", "level": "новичок", "why": "чётко зафиксировать брак и что вы просите.", "when": "нашли брак в партии.", "blocks": ["Претензия по качеству товара\nПартия: [дата, номер документа], товар: [артикул/модель], получено: [N] шт.\nВыявлен брак: [описание дефекта], количество: [N] шт. Фото во вложении.\nПросим: [замену / возврат денег за брак / скидку на следующую партию] в срок до [дата].\nС уважением, [ИП, контакты]"], "notes": ["Юридическую форму претензии и сроки по договору проверьте у юриста."], "start": false}, {"id": "75", "title": "Промпт: сравнить условия поставщиков", "cat": "Документы и поставщики", "type": "Промпт", "level": "новичок", "why": "выбрать фабрику не только по цене, а по полной стоимости и рискам.", "when": "получили 2 и больше ответов на запрос КП.", "blocks": ["Вот ответы фабрик: [вставьте или таблицу].\n1. Сведи в таблицу: цена, мин. партия, срок, образец, ЧЗ, документы, оплата, доставка.\n2. Посчитай полную стоимость единицы до склада (цена + доставка + маркировка, если отдельно).\n3. Риски по каждой: нет ЧЗ, большая предоплата, долгие сроки.\n4. Кого проверить первым и почему. Решение за мной."], "notes": [], "start": false}, {"id": "76", "title": "Шаблон: что должно быть в договоре поставки", "cat": "Документы и поставщики", "type": "Чек-лист", "level": "профи", "why": "не забыть важные пункты до подписания.", "when": "перед первой крупной партией.", "blocks": ["☐ Товар, модель, состав, цвета, размеры (с приложением/фото).\n☐ Цена за единицу, условия изменения цены.\n☐ Сроки изготовления и отгрузки, ответственность за просрочку.\n☐ Требования к качеству и порядок приёмки, что считается браком.\n☐ Маркировка: кто наносит коды, передача УПД по ЭДО.\n☐ Документы: декларация/сертификат.\n☐ Оплата: предоплата, остаток, реквизиты.\n☐ Возврат/замена брака, сроки претензий."], "notes": ["Это чек-лист, а не юридический документ. Текст договора проверьте у юриста."], "start": false}, {"id": "77", "title": "Установка Claude Code на Windows", "cat": "Старт с ИИ", "type": "Инструкция", "level": "новичок", "why": "Claude Code — агент, который работает с файлами на вашем компьютере.", "when": "первый шаг перед любыми агентами.", "blocks": ["1. Нужна платная подписка Claude (Pro или выше) или доступ через API.\n2. Откройте PowerShell (Пуск → «PowerShell»).\n3. Установите Claude Code командой из официальной документации Anthropic (docs.claude.com → Claude Code → установка). На момент записи для Windows это:\n   irm https://claude.ai/install.ps1 | iex\n4. Создайте папку проекта, например «Мой магазин», откройте её в PowerShell (cd «путь к папке»).\n5. Запустите команду claude и войдите в свой аккаунт по ссылке.\n6. Первая задача: «Расскажи, какие файлы лежат в этой папке»."], "notes": ["Команды установки меняются — всегда сверяйтесь с официальной документацией. Есть и приложение Claude Desktop с вкладкой Code — для тех, кто не хочет работать в терминале."], "start": false}, {"id": "78", "title": "Установка Claude Code на Mac", "cat": "Старт с ИИ", "type": "Инструкция", "level": "новичок", "why": "то же, что на Windows, только через Терминал.", "when": "у вас Mac.", "blocks": ["1. Нужна платная подписка Claude или доступ через API.\n2. Откройте «Терминал» (Cmd + пробел → «Терминал»).\n3. Установите Claude Code командой из официальной документации Anthropic. На момент записи:\n   curl -fsSL https://claude.ai/install.sh | bash\n4. Перейдите в папку проекта: cd ~/Documents/«Мой магазин».\n5. Запустите claude и войдите в аккаунт.\n6. Первая задача: «Расскажи, какие файлы лежат в этой папке»."], "notes": ["Сверяйтесь с официальной документацией: команды могут измениться."], "start": false}, {"id": "79", "title": "Claude в браузере Chrome: зачем и как", "cat": "Старт с ИИ", "type": "Инструкция", "level": "новичок", "why": "агент может сам читать страницы кабинета WB и сайтов в вашем браузере, где вы уже вошли.", "when": "нужно, чтобы агент смотрел кабинет или сайты конкурентов.", "blocks": ["ШАГИ\n1. Установите расширение Claude из официального магазина расширений Chrome (издатель — Anthropic).\n2. Войдите тем же аккаунтом, что и в Claude.\n3. В Claude Code / приложении включите работу с браузером.\n\nПРАВИЛА БЕЗОПАСНОСТИ\nАгент в браузере — только читает кабинет. Пароли и коды вводите сами.\nНичего не отправлять, не менять цены и рекламу, не нажимать «Оплатить» без моего «да»."], "notes": [], "start": false}, {"id": "80", "title": "GitHub для селлера: резервная копия агентов", "cat": "Старт с ИИ", "type": "Инструкция", "level": "профи", "why": "инструкции агентов — ваш актив. Если компьютер сломается, их легко потерять.", "when": "когда агентов больше одного.", "blocks": ["1. Зарегистрируйтесь на github.com (бесплатно).\n2. Создайте ПРИВАТНЫЙ репозиторий «agents».\n3. Попросите Claude Code: «Подключи эту папку к моему приватному репозиторию на GitHub и сохрани копию. Токены и пароли в репозиторий не добавляй».\n4. Раз в неделю: «Сохрани изменения в GitHub».\n\nВАЖНО\nФайлы с токенами, ключами, паролями, выгрузками с личными данными покупателей — в .gitignore, никогда не в репозиторий."], "notes": [], "start": false}, {"id": "81", "title": "Как не слить данные, работая с ИИ", "cat": "Старт с ИИ", "type": "Чек-лист", "level": "новичок", "why": "агент работает с вашими кабинетами и файлами — важно не отдать лишнего.", "when": "до начала работы с агентами и при каждом новом подключении.", "blocks": ["☐ Токены и ключи API — в отдельном файле, не в чате и не в инструкциях.\n☐ Токену WB даны только нужные права (чтение, где можно).\n☐ Пароли и коды из SMS вводите только вы.\n☐ В инструкциях нет паспорта, номеров карт и счетов.\n☐ Выгрузки с личными данными покупателей не отправляете в общие чаты.\n☐ Приватный репозиторий, токены в .gitignore.\n☐ Агенту прописано правило «без моего да»."], "notes": [], "start": false}, {"id": "82", "title": "Первые 5 задач агенту для селлера", "cat": "Старт с ИИ", "type": "Промпт", "level": "новичок", "why": "с чего начать, чтобы сразу увидеть пользу.", "when": "только поставили Claude Code.", "blocks": ["1. «Разбери выгрузку продаж за месяц и сделай сводку по артикулам в Excel».\n2. «Прочитай отзывы за месяц и выпиши частые жалобы».\n3. «Посчитай юнит-экономику моего товара по этим данным: [ ]».\n4. «Составь инструкцию о моём магазине (CLAUDE.md), задавай вопросы, если чего-то не хватает».\n5. «Предложи, какую рутину в моём магазине отдать агенту первой, по списку моих задач: [ ]»."], "notes": [], "start": false}, {"id": "83", "title": "Инструкция «голос бренда» для агента", "cat": "Старт с ИИ", "type": "Шаблон", "level": "новичок", "why": "все тексты агента — ответы, описания, посты — звучат одинаково и как вы.", "when": "перед тем как поручать агенту тексты.", "blocks": ["# Голос бренда [название]\nКто мы: [1–2 предложения]. Для кого: [покупатель].\nТон: [тёплый / деловой / дружеский]. Обращение: [на «вы» / на «ты»].\nКак пишем: коротко, по делу, цепляемся за слова покупателя.\nСлова, которые любим: [ ]. Слова, которые не используем: [«лучший», «хит», канцелярит].\nЭмодзи: [какие и сколько].\nЧего не обещаем: [ ].\nПримеры наших удачных текстов: [2–3 примера]."], "notes": [], "start": false}, {"id": "84", "title": "Аудит рутины: что отдать агенту первым", "cat": "Старт с ИИ", "type": "Шаблон", "level": "новичок", "why": "найти задачи, которые повторяются каждую неделю и съедают время, — их первыми отдаём агенту.", "when": "перед тем как строить агентов.", "blocks": ["| Задача | Как часто | Сколько времени уходит | Совет или работа | Нужен доступ к | Риск ошибки |\n|---|---|---|---|---|---|"], "notes": ["Правило: «совет» (придумать, спросить) — хватит чата; «работа» (повторяется, с вашими данными) — задача для агента.\nНачинайте с одной задачи: частой, с понятным результатом и низким риском.\n\nПромпт: «Вот мои задачи за неделю: [список]. Заполни таблицу аудита и предложи первую задачу для агента»."], "start": false}, {"id": "85", "title": "Бот уведомлений о заказах в Telegram", "cat": "Автоматизация и агенты", "type": "Инструкция", "level": "профи", "why": "получать в Telegram новые заказы и низкие остатки, не открывая кабинет.", "when": "когда хотите видеть важное сразу, без постоянных проверок.", "blocks": ["Сделай Telegram-бота уведомлений: новые заказы и остаток ниже [N] шт по артикулам [список].\nТокены бери из файла настройки.txt, в код и чат не выводи. Только чтение данных WB."], "notes": [], "start": false}, {"id": "86", "title": "Ежедневная сводка по магазину", "cat": "Автоматизация и агенты", "type": "Промпт", "level": "новичок", "why": "одно сообщение утром: заказы, выкупы, остатки, реклама.", "when": "каждое утро.", "blocks": ["Сделай сводку за вчера по моему магазину: заказы и выкупы по артикулам, сравнение с тем же днём прошлой недели,\nостатки ниже [N] шт, расход на рекламу, отзывы без ответа.\nВ конце: 3 вещи, которые проверить сегодня. Коротко, чтобы прочитать за минуту."], "notes": [], "start": false}, {"id": "87", "title": "Агент ежедневной прибыли по артикулу", "cat": "Автоматизация и агенты", "type": "Агент", "level": "профи", "why": "видеть не оборот, а чистую прибыль каждого товара.", "when": "когда товаров больше одного и непонятно, какой зарабатывает.", "blocks": ["# Агент прибыли\nКаждый день считаю по каждому артикулу: заказы, выкупы (по созревшей когорте), выручку, расходы WB, логистику,\nсебестоимость, налог, рекламу → чистую прибыль.\nИсточники: отчёты WB (детализация), моя себестоимость из файла себестоимость.xlsx.\nПишу «данных мало», если заказов меньше 30. Ничего в кабинете не меняю.\nИтог: таблица по артикулам + одна строка «какой товар зарабатывает, какой — нет»."], "notes": ["Ставку налога и порядок его расчёта проверьте у бухгалтера."], "start": false}, {"id": "88", "title": "ИИ-менеджер вопросов покупателей (черновики)", "cat": "Автоматизация и агенты", "type": "Агент", "level": "профи", "why": "быстро отвечать на вопросы в карточке и чатах, но каждый ответ — под вашим контролем.", "when": "вопросов много, а отвечать некогда.", "blocks": ["# Агент вопросов\nСобираю новые вопросы покупателей из кабинета (только чтение).\nПишу черновик ответа по фактам о товаре (файл факты.md) и голосу бренда.\nОтправляю ТОЛЬКО после «да» владельца по каждому ответу.\nЕсли в фактах нет ответа — не придумываю, спрашиваю владельца и дописываю факт в факты.md."], "notes": [], "start": false}, {"id": "89", "title": "Расписание: агент работает сам по понедельникам", "cat": "Автоматизация и агенты", "type": "Инструкция", "level": "профи", "why": "регулярные отчёты без напоминаний: агент сам запускается в нужное время.", "when": "есть еженедельная рутина (воронка, отчёт, сверка ЧЗ).", "blocks": ["1. Опишите задачу агенту в файле инструкции (что сделать, откуда данные, куда положить отчёт).\n2. Попросите Claude Code: «Настрой запуск этой задачи каждый понедельник в 9:00» — он предложит способ для вашей системы (планировщик задач Windows, расписание на сервере или встроенные расписания).\n3. Первый запуск проверьте вручную.\n4. Отчёт пусть приходит в Telegram или в папку."], "notes": ["Важно: на компьютере расписание работает, только пока он включён. Для 24/7 — сервер."], "start": false}, {"id": "90", "title": "Агент на сервере: работает, когда компьютер выключен", "cat": "Автоматизация и агенты", "type": "Инструкция", "level": "профи", "why": "боты и регулярные задачи не должны останавливаться, когда вы выключили ноутбук.", "when": "бот или агент нужен круглосуточно.", "blocks": ["1. Арендуйте простой сервер (VPS) с Ubuntu у хостинга (самый маленький тариф обычно подходит для бота).\n2. Подключитесь к серверу по SSH-ключу (Claude Code подскажет команды).\n3. Попросите агента: «Перенеси бота из папки [ ] на сервер, поставь зависимости и настрой автозапуск, чтобы он поднимался после перезагрузки».\n4. Токены перенесите в файл настроек на сервере, не в код.\n5. Проверьте работу и закройте бота на компьютере — одновременно должен работать только один экземпляр."], "notes": ["Оплату и регистрацию у хостинга делаете сами."], "start": false}, {"id": "91", "title": "Промпт: юнит-экономика одного товара", "cat": "Аналитика и фин
