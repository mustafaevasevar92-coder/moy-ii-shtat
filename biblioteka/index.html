ансы", "type": "Промпт", "level": "новичок", "why": "понять, сколько вы реально зарабатываете с одной проданной штуки после всех расходов.", "when": "перед запуском товара, перед закупкой и при смене цены.", "blocks": ["Посчитай юнит-экономику товара на Wildberries по моим данным:\nцена продавца [ ], скидка/СПП не учитываю, комиссия WB [ ] %, логистика до покупателя [ ] ₽,\nобратная логистика [ ] ₽, выкуп [ ] %, хранение на единицу [ ] ₽, приёмка [ ] ₽,\nсебестоимость [ ] ₽, упаковка и маркировка [ ] ₽, реклама на заказ [ ] ₽, налог [ ] % (схема: [ ]).\n\n1. Посчитай прибыль с одной выкупленной штуки и с одного заказа (с учётом невыкупа).\n2. Маржу в % и рентабельность к себестоимости.\n3. Точку безубыточности по цене.\nПокажи расчёт таблицей и формулами. Цифры не придумывай — если чего-то нет, спроси."], "notes": ["Ставки налогов, взносов и порядок учёта проверьте у бухгалтера."], "start": false}, {"id": "92", "title": "Шаблон: таблица юнит-экономики в Excel", "cat": "Аналитика и финансы", "type": "Шаблон", "level": "новичок", "why": "одна таблица на все товары: сразу видно, какой зарабатывает, а какой нет.", "when": "раз в месяц и при каждом изменении цены или себестоимости.", "blocks": ["Создай файл юнит_экономика.xlsx. Столбцы:\nАртикул | Цена продавца | Комиссия % | Комиссия ₽ | Логистика | Обратная логистика × (1 − выкуп) |\nХранение | Себестоимость | Упаковка/маркировка | Реклама на заказ | Налог | Прибыль с заказа | Маржа %.\nФормулы — в ячейках, а не числами, чтобы я могла менять вводные.\nЯчейки с вводными подсвети жёлтым. Заполни по моим данным: [вставьте]."], "notes": ["Ставки налогов, взносов и порядок учёта проверьте у бухгалтера."], "start": false}, {"id": "93", "title": "Промпт: разбор еженедельного отчёта WB", "cat": "Аналитика и финансы", "type": "Промпт", "level": "профи", "why": "понять, из чего сложилась выплата недели и куда ушли деньги.", "when": "каждую неделю после выхода отчёта о реализации.", "blocks": ["Вот детализация отчёта о реализации WB за неделю: [файл].\n1. Сводка: продажи, возвраты, комиссия, логистика, хранение, штрафы, удержания, к перечислению.\n2. Те же статьи по каждому артикулу.\n3. Необычное: штрафы, доплаты, резкий рост логистики или хранения против прошлой недели [файл прошлой недели].\n4. Вопросы, которые стоит задать поддержке WB.\nСчитай только по файлу, ничего не додумывай."], "notes": [], "start": false}, {"id": "94", "title": "Промпт: ABC-анализ товаров", "cat": "Аналитика и финансы", "type": "Промпт", "level": "новичок", "why": "увидеть, какие товары приносят основную прибыль, а какие только занимают деньги и склад.", "when": "раз в месяц или перед новой закупкой.", "blocks": ["Сделай ABC-анализ по моим товарам за 30 дней: [таблица: артикул, выручка, прибыль, продажи шт].\nГруппа A — товары, дающие основную долю прибыли, B — средние, C — остальные (границы групп возьми стандартные 80/15/5 % и покажи их).\nОтдельно отметь товары с выручкой, но без прибыли.\nДля каждой группы — что делать: усиливать, держать, разбираться. Решение за мной."], "notes": [], "start": false}, {"id": "95", "title": "Промпт: сколько закупать, чтобы не было дефицита", "cat": "Аналитика и финансы", "type": "Промпт", "level": "профи", "why": "не остаться без товара в разгар продаж и не заморозить деньги в лишнем остатке.", "when": "перед каждым заказом у фабрики.", "blocks": ["Данные по артикулу: продажи в день за последние 30 дней [ ], остаток на WB и у меня [ ],\nсрок производства [ ] дней, доставка до склада [ ] дней, сезонность: [есть/нет, когда пик].\n1. На сколько дней хватит остатка.\n2. Когда делать заказ, чтобы товар не закончился.\n3. Сколько штук заказать на [N] дней продаж с запасом [ ] %.\n4. Сколько денег это заморозит по себестоимости [ ] ₽.\nПокажи расчёт. Если данных мало — так и скажи."], "notes": [], "start": false}, {"id": "96", "title": "Промпт: движение денег за месяц", "cat": "Аналитика и финансы", "type": "Промпт", "level": "новичок", "why": "понять, почему прибыль вроде есть, а денег на счёте нет.", "when": "в конце каждого месяца.", "blocks": ["Вот выписка по счёту за месяц [файл] и выплаты WB за месяц [файл].\n1. Разложи поступления и платежи по статьям: выплаты WB, закупка, доставка, реклама, сервисы, налоги, вывод себе, прочее.\n2. Итог: сколько пришло, сколько ушло, остаток.\n3. Сколько денег «заморожено» в товаре и в пути.\n4. Три статьи, на которые стоит посмотреть внимательнее.\nНичего не придумывай, неясные платежи вынеси списком — я подпишу их сама."], "notes": [], "start": false}, {"id": "97", "title": "Промпт: минимальная цена без убытка", "cat": "Аналитика и финансы", "type": "Промпт", "level": "новичок", "why": "знать нижнюю границу цены перед акциями и скидками.", "when": "перед участием в акции или снижением цены.", "blocks": ["Мои расходы на единицу: себестоимость [ ], логистика [ ], хранение [ ], упаковка [ ], реклама на заказ [ ].\nКомиссия WB [ ] %, налог [ ] %, выкуп [ ] %.\n1. Посчитай минимальную цену продавца, при которой прибыль = 0.\n2. Цену для прибыли [ ] ₽ с выкупленной единицы.\n3. Какую максимальную скидку в акции можно дать от текущей цены [ ].\nПокажи формулы."], "notes": ["Ставки налогов, взносов и порядок учёта проверьте у бухгалтера."], "start": false}, {"id": "98", "title": "Готовая инструкция: агент «финансовый аналитик»", "cat": "Аналитика и финансы", "type": "Агент", "level": "профи", "why": "агент, который каждую неделю сам разбирает отчёты WB и пишет понятную сводку по деньгам.", "when": "когда отчёты WB читать некогда, а понимать цифры нужно.", "blocks": ["# Агент: финансовый аналитик магазина [название]\n\n## Задача\nРаз в неделю разбираю отчёт о реализации WB и пишу сводку: выручка, расходы WB по статьям,\nприбыль по артикулам, что изменилось к прошлой неделе, что проверить.\n\n## Данные\n- Отчёты WB: папка отчёты/ (или API WB, токен только на чтение, из файла настроек).\n- Себестоимость: себестоимость.xlsx.\n- Налог: схема и ставка — в файле налоги.md (заполняет владелец).\n\n## Правила\n- Считаю только по данным. Нет данных — пишу «нет данных», не додумываю.\n- Меньше 30 продаж по артикулу — вывод с пометкой «данных мало».\n- В кабинете ничего не меняю, деньги не двигаю.\n- Налоговые выводы помечаю «проверить у бухгалтера».\n\n## Результат\nФайл ГГГГ-ММ-ДД_сводка.md + короткое сообщение владельцу: 5 строк."], "notes": [], "start": false}, {"id": "99", "title": "Промпт: итоги месяца для собственника", "cat": "Аналитика и финансы", "type": "Промпт", "level": "новичок", "why": "одна страница о том, как прошёл месяц: деньги, товары, реклама, отзывы.", "when": "первого числа каждого месяца.", "blocks": ["Сделай итоги месяца по магазину на одну страницу. Данные: [продажи, отчёты WB, реклама, отзывы, остатки].\nРазделы: выручка и прибыль (против прошлого месяца), лучшие и худшие артикулы, реклама (расход, ДРР),\nотзывы (оценка, частые жалобы), остатки и закупка, 3 решения на следующий месяц.\nКоротко, без воды, только по данным."], "notes": [], "start": false}];
let cat='Все',lv='Все',q='',open_={},favs=[];
try{favs=JSON.parse(localStorage.getItem('fav')||'[]')}catch(e){}
const $=s=>document.querySelector(s);
const ORDER=['Старт с ИИ','Честный знак','Карточки и SEO','Отзывы и вопросы','Реклама WB','Аналитика и финансы','Конкуренты','Контент и визуал','Склад и поставки','Документы и поставщики','Цены и акции','Автоматизация и агенты'];
const cats=[...ORDER.filter(c=>D.some(d=>d.cat==c)),...[...new Set(D.map(d=>d.cat))].filter(c=>!ORDER.includes(c))];
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function nav(el,items,get,set){el.innerHTML='';items.forEach(([k,label,n])=>{const b=document.createElement('button');b.setAttribute('aria-pressed',get()===k);b.innerHTML=`<span>${label}</span><small>${n}</small>`;b.onclick=()=>{set(k);render()};el.append(b)})}
function render(){
 const base=D.filter(d=>!q||(d.title+d.why+d.cat+d.blocks.join(' ')).toLowerCase().includes(q));
 const byLv=d=>lv=='Все'||d.level==lv, byCat=d=>cat=='Все'||(cat=='★'?d.start:cat=='♥'?favs.includes(d.id):d.cat==cat);
 nav($('#cats'),[['Все','Все материалы',base.filter(byLv).length],['★','Начните отсюда',base.filter(d=>d.start&&byLv(d)).length],['♥','Избранное',base.filter(d=>favs.includes(d.id)&&byLv(d)).length],...cats.map(c=>[c,c,base.filter(d=>d.cat==c&&byLv(d)).length])],()=>cat,v=>cat=v);
 nav($('#lv'),['Все','новичок','профи'].map(l=>[l,l=='Все'?'Любой':l[0].toUpperCase()+l.slice(1),base.filter(d=>byCat(d)&&(l=='Все'||d.level==l)).length]),()=>lv,v=>lv=v);
 const L=base.filter(d=>byCat(d)&&byLv(d));
 $('#ttl').textContent=cat=='Все'?'Все материалы':cat=='★'?'Начните отсюда':cat=='♥'?'Избранное':cat;
 $('#sub').textContent=`Материалов: ${L.length}. Скопируйте шаблон, впишите свои данные в [скобках] и вставьте в Claude. Ничего не отправляется без вашего «да».`;
 $('#grid').innerHTML='';
 L.forEach(d=>{const c=document.createElement('article');c.className='card'+(open_[d.id]?' open':'');
  c.innerHTML=`<div class="row"><button class="head" aria-expanded="${!!open_[d.id]}"><span class="tt"><h3>${esc(d.title)}</h3><span class="tags"><span class="tag ty">${d.type}</span><span class="tag">${d.level}</span>${d.start?'<span class="tag s">начните отсюда</span>':''}</span></span><span class="chev">▶</span></button><button class="fav" aria-label="В избранное" aria-pressed="${favs.includes(d.id)}">★</button></div><div class="body"><p class="why">${esc(d.why)}</p>${d.when?`<p class="why"><b>Когда использовать:</b> ${esc(d.when)}</p>`:""}${d.blocks.map((b,i)=>`<pre>${esc(b)}</pre><button class="copy" data-i="${i}">Скопировать${d.blocks.length>1?' '+(i+1):''}</button>`).join('')}${d.notes.map(n=>`<p class="note">${esc(n)}</p>`).join('')}</div>`;
  c.querySelector('.head').onclick=()=>{open_[d.id]=!open_[d.id];c.classList.toggle('open');c.querySelector('.head').setAttribute('aria-expanded',!!open_[d.id])};
  c.querySelectorAll('.copy').forEach(b=>{const lab=b.textContent;b.onclick=async()=>{try{await navigator.clipboard.writeText(d.blocks[b.dataset.i]);b.textContent='Скопировано ✓'}catch(e){b.textContent='Выделите текст и скопируйте'}setTimeout(()=>b.textContent=lab,1800)}});
  c.querySelector('.fav').onclick=()=>{favs=favs.includes(d.id)?favs.filter(x=>x!=d.id):[...favs,d.id];try{localStorage.setItem('fav',JSON.stringify(favs))}catch(x){};render()};
  $('#grid').append(c)});
 if(!L.length)$('#grid').innerHTML='<p class="empty">Здесь пока пусто.</p>';
}
$('#q').oninput=e=>{q=e.target.value.toLowerCase();render()};
render();
</script></body></html>
