<script>
const D=[{"id": "01", "title": "Инструкция агенту о вашем магазине (CLAUDE.md)", "cat": "Старт с ИИ", "type": "Шаблон", "level": "новичок", "why": "агент один раз узнаёт ваш магазин и больше не переспрашивает. Файл кладётся в папку проекта под именем `CLAUDE.md`, Claude Code читает его сам.", "blocks": ["# Проект Wildberries — [НАЗВАНИЕ БРЕНДА] (общие правила для всех агентов)\n\nЭтот файл читают все агенты в этой папке и её подпапках. Здесь только общее: бизнес, данные, запреты.\nЕсли факт изменился — правим здесь один раз и ставим дату.\n\n## Бизнес\n- Бренд: [бренд]. Город и часовой пояс: [город, МСК+_].\n- Налоговый режим: [УСН доходы _ % / другое] (уточняет бухгалтер).\n- Главный товар: [что продаёте, сезонность].\n- Схемы продаж: [FBO / FBS / обе]. Маркировка: [да, Честный знак / нет].\n\n| Артикул WB | Товар | Статус (дата) |\n|---|---|---|\n| [артикул] | [название] | [в продаже / снят / остаток] |\n\n- Себестоимость: [закупка + расходы на единицу].\n- Цена продавца: [цена], комиссия WB ≈ [_ %].\n- Данные берём с [дата] (если раньше под артикулами был другой товар — укажите).\n\n## Главная цель\nМаксимальная ЧИСТАЯ прибыль — не оборот и не заказы сами по себе.\nКаждый агент отвечает на вопрос: как его работа меняет чистую прибыль.\n\n## Правила для всех агентов\n1. В кабинетах WB, Честного знака и ЭДО ничего не менять, не подписывать и не отправлять без моего явного «да»: цены, акции, реклама, карточки, документы, ответы покупателям. Сначала план, потом согласие, потом действие.\n2. Один тест — один фактор: цену, рекламу и карточку одновременно не меняем.\n3. Выводы — только по достаточным данным. Если событий меньше 30 — пишем «данных мало».\n4. У каждой цифры есть источник. Данные отделяем от выводов: [данные], [вывод агента], [со слов владельца].\n5. Пароли и коды входа вводит только владелец.\n6. Пишем мне просто и коротко: сначала итог, потом детали.\n\n## Источники данных\n- Кабинет WB в браузере: [разделы, которыми пользуетесь].\n- Выгрузки: [папка с файлами].\n- Токен WB API: лежит в [файл]. Не копировать и не показывать в чате.\n\n## Текущие ограничения (обновлять с датой)\n- [например: до __.__ карточку не меняем, идёт тест цены]"], "notes": [], "start": true}, {"id": "02", "title": "Агент «Честный знак» для FBS", "cat": "Честный знак", "type": "Агент", "level": "профи", "why": "ни одна продажа не блокируется из-за маркировки и нет штрафов. Агент сверяет коды, готовит вывод из оборота и документы, а подписываете вы.", "blocks": ["# Агент маркировки «Честный знак» для Wildberries FBS\n\nОбщие правила проекта — в ../CLAUDE.md. Здесь только роль.\n\n## Роль\nВеду маркировку [товар] в «Честном знаке» по продажам FBS:\nтовар принят от поставщика → коды за мной → при продаже выведены из оборота → документы подписаны.\nЦель в деньгах: ни одна продажа не блокируется из-за маркировки и нет штрафов.\n\n## Рабочая папка\n- wb_exports/ — выгрузки WB «Завершённые» (FBS).\n- chz_exports/ — выгрузки кодов из Честного знака.\n- reports/ — отчёты сверки. errors/ — найденные расхождения.\n- Реестр: master_registry.xlsx (код → артикул → статус → документ).\n\n## Что важно знать\n- В выгрузке WB коды маркировки могут приходить с испорченными разделителями (GS заменён на «�»). Перед сверкой коды нужно восстановить.\n- Вход в ЧЗ — только по сертификату КриптоПро, входит владелец.\n- Подписание документов в ЭДО — только владелец.\n\n## Порядок\n1. Сначала план, потом согласие владельца, потом действие.\n2. Вывод из оборота, подписание документов, отправка в ГИС МТ — ТОЛЬКО после явного «да» по каждому пакету.\n3. После каждого шага — отчёт: что сделано, сколько кодов, что осталось. Обновляю реестр.\n4. Если товар снят с продаж из-за маркировки — сообщаю, когда его можно возвращать."], "notes": ["1. Создайте папку `чз` в проекте, положите туда этот файл.\n2. Скачайте выгрузку «Завершённые» FBS из WB и выгрузку кодов из ЧЗ в соответствующие папки.\n3. Напишите агенту готовый промпт из материала «Сверка кодов WB × Честный знак»."], "start": false}, {"id": "03", "title": "Промпт: сверка кодов WB × Честный знак", "cat": "Честный знак", "type": "Промпт", "level": "новичок", "why": "за минуты найти, какие проданные коды не выведены из оборота, какие числятся не за вами и где ошибки документов.", "blocks": ["Сверь продажи FBS с кодами Честного знака.\nФайлы: выгрузка WB «Завершённые» лежит в wb_exports/, выгрузка кодов ЧЗ — в chz_exports/.\n\n1. Восстанови коды маркировки из выгрузки WB: если разделители GS заменены на «�», верни их.\n2. Для каждого проданного кода найди его статус в ЧЗ.\n3. Сделай таблицу reports/сверка_[дата].xlsx: артикул, код, дата продажи, статус в ЧЗ, что сделать.\n4. Отдельно выпиши группы:\n   — продано, но не выведено из оборота;\n   — код числится не за нами;\n   — документ «обработан с ошибками»;\n   — коды, которых нет ни в одной выгрузке.\n5. Итог одной строкой: сколько всего кодов, сколько в порядке, сколько требуют действия.\n\nНичего не выводи из оборота и ничего не подписывай. Только сверка и план действий, дальше жди моего «да»."], "notes": [], "start": true}, {"id": "04", "title": "Агент отзывов: отвечает в вашем стиле", "cat": "Отзывы и вопросы", "type": "Агент", "level": "новичок", "why": "ответ на отзыв читают будущие покупатели. Хороший ответ снимает сомнения (размер, цвет, сезон), плохой (спор, шаблон невпопад) отпугивает.", "blocks": ["# Агент «Отзывы»\n## Роль\nОтвечаю на отзывы покупателей WB так, как ответил бы владелец: по-человечески, не шаблонно.\n## Где беру данные\nКабинет WB → Отзывы и вопросы → «Ждут ответа» (через браузер) или выгрузка.\nУчитываю отзывы с [дата].\n## Файлы\n- стиль.md — стиль владельца и его правки. Читать перед каждым черновиком.\n- журнал_ответов.md — что отправлено: дата, id отзыва, оценка, текст, кто одобрил.\n## Порядок\n1. Собираю неотвеченные отзывы.\n2. Пишу черновик на каждый по стиль.md.\n3. Показываю черновики. Отправляю ТОЛЬКО после «да» по каждому ответу.\n4. Если владелец правит текст — отправляю его вариант и записываю вывод в стиль.md.\n## Что передаю дальше\n- Повторяющиеся жалобы (размер, «не как на фото», брак) — в отчёт для карточки товара.\n- В карточках, ценах и настройках ничего не меняю.", "# Стиль ответов\n1. Коротко: 1–3 предложения на хороший отзыв, до 5 на сложный.\n2. Цепляюсь за слова покупателя, а не пишу общий шаблон.\n3. Тон: [тёплый / деловой]. Эмодзи: [какие, не больше 1–2].\n4. Обращение по имени, без канцелярита («Ваше мнение важно для нас» — нет).\n\n## Логика по типам\n| Тип отзыва | Как отвечаем |\n|---|---|\n| 5★ без текста | спасибо + одна живая деталь о товаре |\n| «не подошло» | спасибо + «жаль, что не подошло», без оправданий |\n| «мало / не как на фото» | спокойно: на фото реальный товар, от чего зависит посадка; без спора |\n| «цвет другой» | оттенок зависит от освещения и экрана |\n| брак | извиняемся, говорим, что делать дальше |\n\n## Чего НЕ делать\n- Не обвинять покупателя и не намекать на конкурентов: WB отклоняет такие ответы.\n- Не требовать фото и доказательств.\n- Не благодарить «за положительный отзыв», если отзыв негативный.\n- Не обещать того, что не подтверждено.\n\n## Правки владельца\n(дата, было → стало, вывод)"], "notes": [], "start": false}, {"id": "05", "title": "Промпт: ответ на отзыв в вашем стиле", "cat": "Отзывы и вопросы", "type": "Промпт", "level": "новичок", "why": "быстро получить 3 варианта ответа, которые не звучат как шаблон.", "blocks": ["Ты отвечаешь на отзывы покупателей моего магазина на Wildberries.\nТовар: [что продаёте]. Тон: [тёплый / деловой], 1–3 предложения, эмодзи не больше одного.\n\nОтзыв: «[вставьте текст отзыва]», оценка [1–5].\n\nПравила:\n— зацепись за конкретные слова покупателя;\n— если есть жалоба — спокойно объясни причину, без спора и без обвинений;\n— не благодари «за положительный отзыв», если он негативный;\n— не обещай того, чего я не подтверждал;\n— не упоминай конкурентов и не проси фото.\n\nДай 3 варианта ответа, от самого короткого к подробному."], "notes": [], "start": true}, {"id": "06", "title": "Агент анализа конкурентов", "cat": "Конкуренты", "type": "Агент", "level": "профи", "why": "понять, где конкуренты зарабатывают больше вас и почему, и превратить это в проверяемые гипотезы.", "blocks": ["# Агент «Конкуренты»\n## Роль\nНахожу и разбираю конкурентов наших товаров [артикулы] из выдачи WB.\nЦель: показать, где конкуренты зарабатывают больше нас и почему, и дать гипотезы. Сам ничего не меняю.\n\n## Что анализирую\n1. Кто конкуренты: топ-30 выдачи по нашим запросам [список]. Оставляю похожие товары того же типа и цены.\n2. Деньги: цена и её история, скидка, отзывы, рейтинг, оценка продаж (из сервиса аналитики — с пометкой «≈»).\n3. Запросы: где конкурент в топе, а нас нет.\n4. Карточка: главное фото, слайды, видео, название, характеристики, частые жалобы в отзывах.\n5. Чем лучше нас — 3–5 пунктов с цифрами, не общими словами.\n\n## Что выдаю\n- Таблицу конкурентов (артикул, цена, рейтинг, отзывы, позиция по главным запросам).\n- Разбор: итог одной строкой → топ-5 конкурентов → запросы, где мы теряем → до 3 гипотез.\n- Гипотеза: «Если [что], то [метрика] вырастет, потому что у [конкурент] [факт]».\n\n## Правила\n1. Только читаю. Ничего не меняю, не покупаю, не подписываюсь.\n2. Если сайт просит пароль, капчу или оплату — останавливаюсь и пишу владельцу.\n3. «Конкурент продаёт больше» — не вывод. Объясняю, за счёт чего: цена, позиция, отзывы, склады, фото, акция."], "notes": [], "start": false}, {"id": "07", "title": "Агент-бухгалтер для ИП на УСН", "cat": "Аналитика и финансы", "type": "Агент", "level": "профи", "why": "не пропускать сроки и заранее знать, сколько платить. Агент считает и готовит файлы, решения и подписи — за вами.", "blocks": ["# Агент-бухгалтер\n## Что делаю\nВеду налоги и учёт ИП на [УСН «доходы» _ %] без работников:\n- раз в неделю беру еженедельный отчёт WB и записываю доход в книгу доходов (КУДиР);\n- раз в квартал считаю аванс и готовлю уведомление;\n- раз в год готовлю декларацию и считаю страховые взносы ИП;\n- слежу за календарём сроков и напоминаю заранее.\n\nВ начале работы читаю только СОСТОЯНИЕ.md (одна страница). В конце задачи обновляю его: факты, что открыто, следующий шаг.\n\n## Что выдаю\nОдно короткое сообщение: сколько платить, до какого числа, что подписать. Плюс файл (уведомление, декларация, расчёт в Excel). Без бухгалтерских слов или с объяснением в скобках.\n\n## Нельзя\n- Отправлять в налоговую, подписывать, платить — только после явного «да» на конкретный документ и сумму.\n- Вводить пароли, коды, ПИН сертификата — это делает только владелец.\n- Кабинеты налоговой и WB — только чтение.\n- Хранить в файлах номер счёта, паспорт, СНИЛС, пароли."], "notes": ["агент не заменяет бухгалтера. Ставку, режим и расчёты сверяйте со своим бухгалтером или налоговой."], "start": false}, {"id": "08", "title": "Команда агентов с директором", "cat": "Старт с ИИ", "type": "Схема", "level": "профи", "why": "когда агентов несколько, им нужен порядок: кто за что отвечает, кто ставит задачи и как они передают работу.", "blocks": ["## Команда\n| Агент | Папка и инструкция | Зона ответственности |\n|---|---|---|\n| Директор | директор/CLAUDE.md | обходит кабинет (только чтение), ставит задачи агентам, даёт владельцу итог и 3 шага |\n| Стратегия прибыли | стратегия/CLAUDE.md | цена, реклама, юнит-экономика, порядок тестов; решает, что сейчас нельзя трогать |\n| Воронка | воронка/CLAUDE.md | показы → переход → корзина → заказ → выкуп; одна гипотеза в неделю |\n| Честный знак | чз/CLAUDE.md | сверка кодов, вывод из оборота, документы |\n| Отзывы | отзывы/CLAUDE.md | ответы в стиле владельца, только после «да» |\n| Бухгалтер | бухгалтер/CLAUDE.md | налоги, сроки, отчёты |\n\nЦепочка: стратегия (цель в деньгах) → воронка (что менять) → дизайн (макеты) → согласие владельца → изменение → стратегия считает эффект.\n\n## Передача работы\nКаждый агент по итогам задачи дописывает строку в лента.md:\nГГГГ-ММ-ДД ЧЧ:ММ | от кого → кому | что сделано | путь к файлу"], "notes": [], "start": false}, {"id": "09", "title": "Правило «без моего да»: безопасность агента", "cat": "Старт с ИИ", "type": "Шаблон", "level": "новичок", "why": "агент работает с вашими кабинетами и файлами. Эти правила задают, что он ничего не отправит, не оплатит и не удалит сам.", "blocks": ["## Безопасность\n1. Ничего не отправлять покупателям, не платить, не удалять и не подписывать без моего явного «да» по конкретному действию.\n2. Цены, скидки, акции, рекламу и карточки — только читать. Изменения — план → моё «да» → действие.\n3. Пароли, коды из SMS, ПИН сертификата вводит только владелец.\n4. Токены и ключи API не копировать в другие файлы и не показывать в чате.\n5. В файлах не хранить номера карт и счетов, паспорт, СНИЛС, личные данные покупателей.\n6. Если сайт просит пароль, капчу или оплату — остановиться и написать владельцу.\n7. После каждого действия — короткий отчёт: что сделано, что осталось."], "notes": [], "start": false}, {"id": "10", "title": "Агент воронки продаж: раз в неделю находит, где теряются покупатели", "cat": "Аналитика и финансы", "type": "Агент", "level": "профи", "why": "каждую неделю видеть один шаг, на котором уходят покупатели, и проверять одну гипотезу, а не менять всё сразу.", "blocks": ["# Аналитик воронки — еженедельный запуск (понедельник)\n\n## Карточки\n[артикул 1], [артикул 2] — данные только с [дата].\n\n## Шаги\n1. Беру последнюю полную неделю (пн–вс) и неделю перед ней.\n   Источник: Кабинет WB → Аналитика → Воронка продаж (переходы, корзина, заказы, выкупы, отмены, цена, остатки)\n   и Продвижение (рекламные показы, клики, затраты).\n   Если API WB упёрся в лимит — не повторяю запросы, беру цифры из кабинета.\n2. Считаю шаги:\n   - CTR рекламы = клики / показы\n   - Переход → корзина = корзина / переходы\n   - Корзина → заказ = заказы / корзина\n   - Заказ → выкуп = выкупы / (выкупы + отмены) — только среди уже полученных заказов\n   - Сквозная = выкупы / переходы\n3. Первым делом смотрю остатки. Потом нахожу обрыв (один шаг), 2–3 причины, проверяю гипотезу прошлой недели.\n4. Предлагаю ОДНУ гипотезу на неделю.\n\n## Причины по шагам\n- показы → переход: главное фото, цена в выдаче, рейтинг, позиция;\n- переход → корзина: фото, описание, размеры, отзывы, цена против конкурентов;\n- корзина → заказ: срок доставки, нет размера или цвета, изменилась цена;\n- заказ → выкуп: товар не совпал с фото, размер, качество, долгая доставка.\n\n## Правила\n- Гипотеза: «Если поменять [что], то [шаг] вырастет с X% до Y%, потому что [причина]». За неделю меняем одно.\n- Вердикт прошлой гипотезы: СРАБОТАЛО / НЕ СРАБОТАЛО / НЕПОНЯТНО (если менялись цена, остатки, реклама, акция или сезон).\n- Меньше 30 переходов за неделю — пишу «данных мало».\n- В кабинете ничего не меняю. Каждая цифра — с источником.\n\n## Отчёт (8 пунктов, коротко)\n1. Итог недели одной строкой. 2. Таблица шагов: эта / прошлая / разница. 3. Где обрыв.\n4. Почему (2–3 причины). 5. Вердикт по прошлой гипотезе с цифрами. 6. Одна гипотеза на неделю.\n7. Что нужно от владельца и до какого дня. 8. Путь к обновлённому файлу."], "notes": [], "start": false}, {"id": "11", "title": "Промпт: недельный отчёт по воронке за 1 минуту чтения", "cat": "Аналитика и финансы", "type": "Промпт", "level": "новичок", "why": "получить понятный отчёт по своей воронке без таблиц на 10 листов.", "blocks": ["Вот цифры воронки моих товаров на WB за две недели (эта и прошлая):\n[вставьте таблицу или приложите файл: артикул, переходы, корзина, заказы, выкупы, отмены, рекламные показы и клики, остаток]\n\nПосчитай по каждому артикулу:\n— CTR рекламы = клики / показы;\n— переход → корзина; корзина → заказ;\n— заказ → выкуп = выкупы / (выкупы + отмены);\n— сквозную = выкупы / переходы.\n\nДай отчёт простыми словами:\n1. Итог недели одной строкой.\n2. Таблица: эта неделя / прошлая / разница со стрелкой ↑↓.\n3. На каком ОДНОМ шаге главный обрыв.\n4. 2–3 возможные причины (фото, цена, размеры, отзывы, доставка, остатки).\n5. Одна гипотеза в формате: «Если поменять [что], то [шаг] вырастет с X% до Y%, потому что [причина]».\nЕсли где-то меньше 30 событий — так и напиши: «данных мало»."], "notes": [], "start": false}, {"id": "12", "title": "Одна гипотеза в неделю: журнал тестов", "cat": "Аналитика и финансы", "type": "Шаблон", "level": "новичок", "why": "не путаться, что сработало. Меняем одно — через неделю честно проверяем.", "blocks": ["Неделя: [дд.мм–дд.мм]\nКарточка: [артикул]\nЧто меняли: [одно изменение]\nКакой шаг ждали: [например, переход → корзина]\nБыло: [X %]   Стало: [Y %]\nВердикт: СРАБОТАЛО / НЕ СРАБОТАЛО / НЕПОНЯТНО / ЗАПЛАНИРОВАНО\nЧто мешало выводу: [менялись цена, реклама, остатки, акция, сезон]\nРешение: оставить / откатить / новая гипотеза"], "notes": ["- Гипотеза пишется так: «Если поменять [что], то [шаг] вырастет с X% до Y%, потому что [причина]».\n- За неделю — одно изменение на карточку.\n- «Непонятно» — честный вердикт, если параллельно менялось что-то ещё."], "start": false}, {"id": "13", "title": "Агент стратегии: максимум чистой прибыли, а не оборота", "cat": "Аналитика и финансы", "type": "Агент", "level": "профи", "why": "каждый день отвечать на вопрос «что изменить или оставить, чтобы заработать больше чистыми?» и не путать рост заказов с ростом прибыли.", "blocks": ["# Агент стратегии прибыли\nЕдинственная цель — максимальная суммарная ЧИСТАЯ прибыль. Не цена, не заказы, не оборот.\nЕжедневный вопрос: «Что сегодня изменить или оставить без изменений, чтобы владелец заработал больше чистыми?»\n\n## Единые определения\n- Цена продавца = после собственной скидки. Цена покупателя = цена продавца × (1 − СПП).\n- Расходы WB = комиссия, эквайринг, хранение, приёмка, штрафы (без логистики и рекламы).\n- Чистая прибыль = Выручка − Расходы WB − Логистика − Обратная логистика − Себестоимость − Налог − Реклама.\n- ДРР по заказам = Реклама / (Заказы шт × Цена продавца).\n- Выкуп % — только по «созревшей» когорте заказов.\n\n## Обязательные правила\n1. Цену дня оцениваю только по когорте заказов этого дня после того, как она созрела (все заказы доехали).\n2. Рост заказов ≠ эффективность. Итог — изменение ОБЩЕЙ чистой прибыли.\n3. Реклама: считаю дополнительные заказы относительно базы без рекламы, а не все заказы периода.\n4. Один тест — один фактор: только цена ИЛИ только бюджет ИЛИ только ставка.\n5. Не предполагаю «дешевле лучше» или «дороже лучше» — ищу цену максимальной общей прибыли по факту.\n6. Один день — сигнал, не доказательство. При меньше 30 заказах расширяю период.\n7. Учитываю день недели, праздники, остатки, акции, СПП, сезон, конкурентов.\n8. Никогда сам не меняю цену, скидку, акции, ставки, бюджеты. Цикл: анализ → ОДИН тест → ожидаемый эффект → согласие → тест → итог.\n\n## Ежедневный отчёт\nЗаканчиваю блоком «РЕКОМЕНДАЦИЯ НА СЕГОДНЯ»: Цена — …, Реклама — …, Причина — …, когда следующее решение."], "notes": [], "start": false}, {"id": "14", "title": "Карточка эксперимента: тест цены или рекламы без хаоса", "cat": "Аналитика и финансы", "type": "Шаблон", "level": "новичок", "why": "перед любым изменением цены или рекламы записать, что именно меняем и когда остановимся. Так тест можно честно оценить.", "blocks": ["ЭКСПЕРИМЕНТ\nЧто меняем:\nПочему:\nТекущий показатель:\nНовая настройка:\nЧто оставляем без изменений:\nСколько длится тест:\nКакие показатели смотрим:\nУсловие успеха:\nУсловие остановки:\nСогласие владельца: да / нет"], "notes": ["Попросите агента: «Предложи один тест для [артикул] в формате карточки ЭКСПЕРИМЕНТ. Ничего не меняй, жди моего да»."], "start": false}, {"id": "15", "title": "Промпт: юнит-экономика и чистая прибыль с одной продажи", "cat": "Аналитика и финансы", "type": "Промпт", "level": "новичок", "why": "понять, сколько вы реально зарабатываете с одного проданного товара после всех расходов WB, налога и рекламы.", "blocks": ["Посчитай юнит-экономику моего товара на Wildberries.\n\nДанные:\n— цена продавца (после моей скидки): [ ] ₽\n— к перечислению с одной продажи (из еженедельного отчёта WB) или комиссия WB: [ ]\n— себестоимость (закупка + упаковка + доставка до склада): [ ] ₽\n— логистика до покупателя и обратная логистика при отказе: [ ] ₽\n— процент выкупа: [ ] %\n— налог: [ ] % от [чего считается у вас]\n— реклама на один заказ (или ДРР): [ ]\n\nПосчитай:\n1. Чистую прибыль с одной выкупленной продажи.\n2. Чистую прибыль с одного заказа с учётом выкупа и отказов.\n3. При каком выкупе и какой ДРР товар уходит в ноль.\nПокажи расчёт по шагам, каждую формулу. Если каких-то данных нет — спроси, не придумывай."], "notes": [], "start": false}, {"id": "16", "title": "Промпт: разбор рекламы — что она реально добавила", "cat": "Реклама WB", "type": "Промпт", "level": "профи", "why": "понять, сколько заказов дала именно реклама сверх обычных продаж, и окупается ли она в чистой прибыли.", "blocks": ["Вот данные по рекламе и продажам моего товара по дням: [приложите файл или таблицу:\nдата, бюджет рекламы, показы, клики, CTR, CPC, заказы всего, цена продавца].\nБыли дни без рекламы / с разным бюджетом: [опишите].\n\n1. Посчитай CTR, CPC, ДРР по заказам = реклама / (заказы × цена продавца).\n2. Сравни заказы в дни без рекламы и с рекламой: сколько ДОПОЛНИТЕЛЬНЫХ заказов дала реклама.\n3. Посчитай, сколько чистой прибыли принесли эти дополнительные заказы минус расход на рекламу.\n4. Сравни уровни бюджета (например, 0 / 500 / 1000 / 1500 ₽ в сутки), где больше чистой прибыли.\n5. Учти, что могли влиять цена, остатки, акции, день недели. Если данных мало (меньше 30 заказов) — так и скажи.\nНичего в рекламном кабинете не меняй. Дай вывод и одно предложение теста в формате карточки ЭКСПЕРИМЕНТ."], "notes": [], "start": false}, {"id": "17", "title": "Агент поиска фабрик (без перекупов)", "cat": "Документы и поставщики", "type": "Агент", "level": "профи", "why": "найти настоящих производителей со своим оборудованием, а не посредников, и иметь запасную фабрику на сезон.", "blocks": ["# Агент «Поставщики»\n## Роль\nИщу и проверяю производителей [товар]: фабрики и цеха со своим оборудованием, а не перекупов.\nЦель в деньгах: товар не заканчивается в сезон, закупка не дороже нынешней ([цена] ₽), качество не хуже, есть запасная фабрика.\n\n## Что ищу\n- [описание товара], партии от [N] шт.\n- Плюс, если фабрика умеет Честный знак (наносит коды, шлёт УПД по ЭДО).\n- География: [страны и регионы по приоритету].\n\n## Где ищу\nПоисковики, сайты фабрик, отраслевые каталоги, 2ГИС, Яндекс Карты, выставки.\nПроверка: ИНН и ОКВЭД в открытых реестрах, живое ли юрлицо, фото цеха, оборудование, мощность в месяц.\nЕсли для данных нужна регистрация — пишу владельцу, где именно. Регистрируется и вводит пароли только он.\n\n## Что выдаю\n- Таблицу: название, ИНН, город, сайт, контакты, что производят, признаки производства, мин. партия, цена, ЧЗ, приоритет, комментарий. Лист «Отсеяны» с причиной.\n- Короткий итог: кому звонить первым и почему.\n- Скрипт звонка или письма фабрике.\n\n## Запреты\n- Никому не пишу и не звоню от имени владельца без его «да». Письма — только черновики.\n- Ничего не оплачиваю и не подписываю.\n- ИНН, взятые с сайтов фабрик, помечаю «не проверено в налоговой», пока не проверено."], "notes": [], "start": false}, {"id": "18", "title": "10 вопросов фабрике при первом звонке", "cat": "Документы и поставщики", "type": "Шаблон", "level": "новичок", "why": "за один звонок понять, фабрика это или перекуп, и сможет ли она стабильно отгружать с маркировкой.", "blocks": ["1. Вы сами производите или заказываете у других? Сколько у вас оборудования, какое?\n2. Можете сделать нашу модель: [описание + фото]?\n3. Из какого материала и какой состав? Можно повторить наш состав?\n4. Цена за штуку при [100 / 300 / 500] шт? Цена образца?\n5. Минимальная партия на модель и на цвет?\n6. Сколько дней на образец и на партию? Сколько можете делать в месяц в сезон?\n7. Работаете с Честным знаком? Наносите коды сами? Отправляете УПД по ЭДО?\n8. Есть декларация соответствия ЕАЭС на этот товар?\n9. Как оплата (предоплата, сколько %)? Работаете с ИП, есть закрывающие документы?\n10. Как и за сколько доставка до [ваш город]?"], "notes": ["«Подготовь письмо фабрике [название] с этими 10 вопросами, коротко и вежливо. Не отправляй — покажи черновик»."], "start": false}, {"id": "19", "title": "Промпт: проверить поставщика за 10 минут", "cat": "Документы и поставщики", "type": "Промпт", "level": "новичок", "why": "отсеять перекупов и «однодневки» до того, как отправите предоплату.", "blocks": ["Проверь поставщика по открытым данным: [название, сайт, ИНН если есть].\n\n1. Живое ли юрлицо, с какого года, основной ОКВЭД — производство или торговля?\n2. Есть ли признаки собственного производства: фото цеха, оборудование, адрес производства, видео?\n3. Отзывы о компании, жалобы, суды (если есть в открытых источниках).\n4. Совпадают ли контакты на сайте, в реестре и на картах.\n5. Итог: «похоже на фабрику / похоже на перекупа / непонятно» и почему, 3–5 пунктов.\nГде данные не удалось проверить — пиши «не проверено». Ни с кем не связывайся и никуда не регистрируйся."], "notes": [], "start": false}, {"id": "20", "title": "Чек-лист «Честный знак» для FBS: 15 минут раз в неделю", "cat": "Честный знак", "type": "Чек-лист", "level": "новичок", "why": "при FBS вы сами выводите каждый проданный код из оборота. WB этого за вас не делает, даже если в выгрузке есть номер чека.", "blocks": ["☐ WB → Маркетплейс (FBS) → Завершённые: что выкуплено за неделю.\n☐ Коды этих вещей — ваши и в статусе «В обороте».\n☐ Есть «Вывод из оборота» на каждую дату отгрузки, всё «Обработан успешно».\n☐ Во «Входящих» нет УПД «с ошибками» и «требуется подпись».\n☐ Подписанные черновики удалены."], "notes": ["основа — шпаргалка Гули по ЧЗ для FBS (лёгкая промышленность). Правила меняются — сверяйтесь с официальными статьями ЧЗ и WB.", "«Пройди со мной недельный чек-лист Честного знака по FBS. Возьми выгрузку «Завершённые» и выгрузку кодов из ЧЗ, отметь, что в порядке, а что требует действия. Ничего не подписывай»."], "start": false}, {"id": "21", "title": "Честный знак: вывод из оборота при FBS — пошагово", "cat": "Честный знак", "type": "Инструкция", "level": "новичок", "why": "самое важное действие при FBS. Без него проданные коды висят «в обороте».", "blocks": ["ПОДГОТОВКА (один раз)\n- Электронная подпись (УКЭП) на ИП, проверьте срок.\n- КриптоПро CSP + плагин + расширение браузера.\n- Подключена товарная группа «Лёгкая промышленность», есть ЭДО Лайт.\n- МОД в профиле ЧЗ — адрес вашего склада (добавляется по ID ФИАС). Без МОД документ на вывод не заполнить.\n\nПРИЁМКА ОТ ФАБРИКИ\n- Фабрика присылает УПД с кодами, вы подписываете его в ЭДО.\n- Проверьте: ЧЗ → Документы → Входящие → «Обработан успешно». «Подписан» ≠ «принят».\n- Кодов должно быть ровно столько, сколько вещей приехало.\n\nСБОРКА ЗАКАЗА FBS\n- Сканируйте код с той самой вещи, что кладёте в пакет. Код должен быть ваш и «В обороте».\n\nВЫВОД ИЗ ОБОРОТА\nКогда: при отгрузке, до доставки покупателю.\nГде: ЧЗ → Лёгкая промышленность → Документы → Создать → Вывод из оборота.\n  Причина:      «Дистанционная продажа»\n  Дата вывода:  дата отгрузки (один документ на каждый день отгрузки)\n  Место:        ваш МОД\n  Коды:         первые 31 символ: 01 + GTIN + 21 + серийный номер\n  Цена за шт.:  обязательна, берите «Стоимость» из WB\nСохранить черновик → проверить → «Подписать и отправить».\nПотом убедитесь: документ «Обработан успешно», код «Выбыл».\n\nОТКАЗЫ И ВОЗВРАТЫ\n- Вывели код, а покупатель отказался → Создать → Возврат в оборот."], "notes": ["основа — шпаргалка Гули (лёгкая промышленность, октябрь 2026). Не заменяет консультацию юриста; правила меняются."], "start": false}, {"id": "22", "title": "Честный знак при FBS: 7 частых ошибок", "cat": "Честный знак", "type": "Чек-лист", "level": "новичок", "why": "каждая из этих ошибок блокирует продажи или оставляет коды «висеть».", "blocks": ["1. «WB сам выведет». При FBS — нет: чек ≠ вывод из оборота.\n2. «Подписан» = «принят». Нет: смотрите статус документа в ЧЗ, нужен «Обработан успешно».\n3. Нет МОД в профиле — документ на вывод не заполнить.\n4. Повторно подписали старый черновик — ошибка «недопустимый статус».\n5. Коды из Excel WB с символом «�» вместо разделителя — берите первые 31 символ.\n6. Кавычка \" или % в коде — вставка не проходит, выбирайте код из списка.\n7. Нет сверки кодов с приходом — лишние коды висят «В обороте»."], "notes": ["ошибки, которые Гуля разобрала в своём магазине (шпаргалка, октябрь 2026).", "«Проверь мои выгрузки WB и ЧЗ на эти 7 ошибок и покажи, где они есть»."], "start": false}, {"id": "23", "title": "Директор-агент: главный над командой агентов", "cat": "Старт с ИИ", "type": "Агент", "level": "профи", "why": "когда агентов много, один «директор» сводит картину, решает порядок и даёт владельцу один короткий итог и 3 шага.", "blocks": ["# Директор-агент\n## Что делаю\n1. Собираю картину: отчёты агентов в их папках + сам проверяю цифры (заказы, цены, остатки, акции, воронка) — только чтение.\n2. Решаю, что сейчас важнее всего для чистой прибыли, с учётом ограничений и правила «один тест — один фактор».\n   Если агенты мешают друг другу (например, креатив во время теста цены) — решаю порядок и объясняю владельцу.\n3. Ставлю задачи агентам: что сделать, к какому сроку и как это меняет чистую прибыль.\n4. Даю владельцу один короткий ответ: где мы и 3 следующих шага. Отдельной строкой — что нужно от него (одно «да»/«нет»).\n\n## Что вижу как руководитель продаж\n- Конфликты: акция или реклама во время теста цены; кончился остаток при работающей рекламе; товар без кодов ЧЗ на FBS.\n- План закупки: остаток / заказы в день = дней продаж; сколько и когда заказать, чтобы не обнулиться в сезон.\n\n## Чего не делаю\n- В кабинетах ничего не меняю, не подписываю и не отправляю. Только смотрю.\n- Не подменяю агентов: цифры считает стратегия, коды — агент ЧЗ. Я свожу и решаю порядок.\n- Не беру решения за владельца: деньги, цены, акции, реклама, закупка — только его «да».\n\n## Итог (файл директор/итог.md, перезаписываю)\n# Итог директора на ДД.ММ.ГГГГ\nГде мы: 2–3 строки с цифрами.\n3 шага: что, кто из агентов, к какой дате.\nНужно от владельца: одно-два «да»/«нет»."], "notes": ["директор-агент в команде Гули (в работе)."], "start": false}, {"id": "24", "title": "Промпт: когда и сколько заказать у фабрики", "cat": "Склад и поставки", "type": "Промпт", "level": "новичок", "why": "не обнулиться в сезон и не заморозить деньги в лишнем товаре.", "blocks": ["Помоги спланировать закупку.\nДанные по каждому артикулу: остаток на складе WB [ ], остаток на своём складе [ ], заказов в день в среднем за 14 дней [ ],\nсрок производства у фабрики [ ] дней, доставка до склада [ ] дней, приёмка WB [ ] дней, минимальная партия [ ] шт.\nСезон: [когда пик, когда спад].\n\n1. Посчитай, на сколько дней хватит остатка: остаток / заказы в день.\n2. Когда нужно сделать заказ фабрике, чтобы товар приехал до того, как остаток кончится (с запасом 7 дней).\n3. Сколько штук заказать на [N] недель продаж с учётом сезона.\n4. Риски: что будет, если заказы вырастут на 30% или упадут на 30%.\nЕсли данных мало — так и скажи. Ничего никому не отправляй."], "notes": [], "start": false}, {"id": "25", "title": "Промпт: «блок честности» в карточке из жалоб покупателей", "cat": "Карточки и SEO", "type": "Промпт", "level": "новичок", "why": "если покупатели часто пишут «маленькое», «не как на фото», «не для зимы» — это нужно честно сказать в карточке. Так меньше возвратов и плохих отзывов.", "blocks": ["Вот отзывы на мой товар за последние [N] месяцев: [вставьте или приложите файл].\n\n1. Найди повторяющиеся жалобы и сомнения (размер, объём, сезон, цвет, качество, швы) и посчитай, сколько раз каждая встречается.\n2. Для топ-3 жалоб напиши, что нужно честно указать в карточке: точные размеры в см, для какого сезона, как выглядит цвет при разном свете.\n3. Предложи текст «блока честности» для описания (5–7 коротких строк) и идею одного слайда инфографики.\n4. Не обещай того, чего нет в данных о товаре. Если чего-то не хватает (например, размеров) — спроси меня.\nНичего в карточке не меняй."], "notes": ["первый шаг плана воронки у Гули: честные размеры, сезон и цвет в карточке."], "start": true}, {"id": "26", "title": "Промпт: ответ на вопрос покупателя в карточке", "cat": "Отзывы и вопросы", "type": "Промпт", "level": "новичок", "why": "вопросы в карточке читают все, кто сомневается. Быстрый точный ответ помогает решиться на заказ.", "blocks": ["Ответь на вопрос покупателя в карточке моего товара на WB.\nО товаре: [название, размеры, материал, сезон, уход — то, что точно знаю].\nВопрос: «[текст вопроса]».\n\nПравила:\n— отвечай только по фактам о товаре выше; если ответа в фактах нет — напиши мне, что уточнить, а не придумывай;\n— 1–3 предложения, вежливо, без канцелярита;\n— если вопрос про размер — дай конкретные цифры в см и совет, как выбрать;\n— не обещай сроков доставки и того, что зависит от WB.\nДай 2 варианта ответа."], "notes": [], "start": false}, {"id": "27", "title": "Промпт: первая задача агенту — разбор выгрузки продаж", "cat": "Старт с ИИ", "type": "Промпт", "level": "новичок", "why": "хороший первый шаг с агентом: он сам открывает вашу выгрузку и кладёт готовую сводку, а не объясняет, как сделать в Excel.", "blocks": ["В папке лежит выгрузка продаж из кабинета WB: [имя файла].\n1. Открой её и разберись, какие там столбцы.\n2. Посчитай за период: сколько заказов и выкупов по каждому артикулу, выручку, средний чек.\n3. Покажи топ-5 товаров, которые принесли больше всего денег, и 5 самых слабых.\n4. Сохрани результат в таблицу сводка_[дата].xlsx в эту же папку.\n5. В конце — 3 вывода простыми словами.\nИсходный файл не меняй."], "notes": [], "start": true}, {"id": "28", "title": "Промпт: ТЗ дизайнеру на инфографику карточки", "cat": "Контент и визуал", "type": "Промпт", "level": "новичок", "why": "получить понятное ТЗ на слайды карточки, основанное на том, что реально волнует покупателей.", "blocks": ["Составь ТЗ дизайнеру на [N] слайдов инфографики для товара на WB.\nТовар: [название, преимущества, размеры, материал, сезон].\nЧастые вопросы и жалобы покупателей: [из отзывов и вопросов].\nГлавные конкуренты (что у них на первом слайде): [если знаете].\n\nДля каждого слайда:\n— задача слайда (что покупатель должен понять за 2 секунды);\n— заголовок до 5 слов;\n— 2–3 подписи;\n— что на фото/иллюстрации;\n— чего НЕ писать (обещаний, которые товар не выполняет).\nПервый слайд — для клика в выдаче, следующие — снимают сомнения из отзывов."], "notes": ["у Гули воронка передаёт ТЗ креативному директору; Гуля сама работала дизайнером карточек."], "start": false}, {"id": "29", "title": "Лента передач: как агенты передают работу друг другу", "cat": "Старт с ИИ", "type": "Шаблон", "level": "профи", "why": "когда агентов несколько, каждый пишет одну строку о сделанном в общий файл. Новый агент читает хвост ленты и сразу в курсе, без пересказов.", "blocks": ["## Передача работы\nРезультат — файл с датой ГГГГ-ММ-ДД_<коротко>.md в своей папке + строка в конец лента.md:\nГГГГ-ММ-ДД ЧЧ:ММ | от кого → кому | что сделано | путь к файлу\nНе хватает данных — пишу «→ владельцу: нужно …», не додумываю.\nЧитать ленту — только последние 10 строк, не весь файл.\n\nПример строки:\n2026-11-03 19:45 | воронка → стратегия | гипотеза недели: блок честности на карточке | воронка/2026-11-03_гипотеза.md"], "notes": ["так работают все проекты Гули (файл лента.md)."], "start": false}];
let cat='Все',lv='Все',q='',open_={},favs=[];
try{favs=JSON.parse(localStorage.getItem('fav')||'[]')}catch(e){}
const $=s=>document.querySelector(s);
const ORDER=['Старт с ИИ','Честный знак','Карточки и SEO','Отзывы и вопросы','Реклама WB','Аналитика и финансы','Конкуренты','Контент и визуал','Склад и поставки','Документы и поставщики'];
const cats=[...ORDER.filter(c=>D.some(d=>d.cat==c)),...[...new Set(D.map(d=>d.cat))].filter(c=>!ORDER.includes(c))];
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function nav(el,items,get,set){el.innerHTML='';items.forEach(([k,label,n])=>{const b=document.createElement('button');b.setAttribute('aria-pressed',get()===k);b.innerHTML=`<span>${label}</span><small>${n}</small>`;b.onclick=()=>{set(k);render()};el.append(b)})}
function render(){
 const base=D.filter(d=>!q||(d.title+d.why+d.cat+d.blocks.join(' ')).toLowerCase().includes(q));
 const byLv=d=>lv=='Все'||d.level==lv, byCat=d=>cat=='Все'||(cat=='★'?d.start:cat=='♥'?favs.includes(d.id):d.cat==cat);
 nav($('#cats'),[['Все','Все материалы',base.filter(byLv).length],['★','Начните отсюда',base.filter(d=>d.start&&byLv(d)).length],['♥','Избранное',base.filter(d=>favs.includes(d.id)&&byLv(d)).length],...cats.map(c=>[c,c,base.filter(d=>d.cat==c&&byLv(d)).length])],()=>cat,v=>cat=v);
 nav($('#lv'),['Все','новичок','профи'].map(l=>[l,l=='Все'?'Любой':l[0].toUpperCase()+l.slice(1),base.filter(d=>byCat(d)&&(l=='Все'||d.level==l)).length]),()=>lv,v=>lv=v);
 const L=base.filter(d=>byCat(d)&&byLv(d));
 $('#ttl').textContent=cat=='Все'?'Все материалы':cat=='★'?'Начните отсюда':cat=='♥'?'Избранное':cat;
 $('#sub').textContent=`Материалов: ${L.length}. Скопируйте шаблон, впишите свои данные в [скобках] и вставьте в Claude. Ничего не отправляется без вашего «да».`;
 $('#grid').innerHTML='';
 L.forEach(d=>{const c=document.createElement('article');c.className='card'+(open_[d.id]?' open':'');
  c.innerHTML=`<div class="row"><button class="head" aria-expanded="${!!open_[d.id]}"><span class="tt"><h3>${esc(d.title)}</h3><span class="tags"><span class="tag ty">${d.type}</span><span class="tag">${d.level}</span>${d.start?'<span class="tag s">начните отсюда</span>':''}</span></span><span class="chev">▶</span></button><button class="fav" aria-label="В избранное" aria-pressed="${favs.includes(d.id)}">★</button></div><div class="body"><p class="why">${esc(d.why)}</p>${d.blocks.map((b,i)=>`<pre>${esc(b)}</pre><button class="copy" data-i="${i}">Скопировать${d.blocks.length>1?' '+(i+1):''}</button>`).join('')}${d.notes.map(n=>`<p class="note">${esc(n)}</p>`).join('')}</div>`;
  c.querySelector('.head').onclick=()=>{open_[d.id]=!open_[d.id];c.classList.toggle('open');c.querySelector('.head').setAttribute('aria-expanded',!!open_[d.id])};
  c.querySelectorAll('.copy').forEach(b=>{const lab=b.textContent;b.onclick=async()=>{try{await navigator.clipboard.writeText(d.blocks[b.dataset.i]);b.textContent='Скопировано ✓'}catch(e){b.textContent='Выделите текст и скопируйте'}setTimeout(()=>b.textContent=lab,1800)}});
  c.querySelector('.fav').onclick=()=>{favs=favs.includes(d.id)?favs.filter(x=>x!=d.id):[...favs,d.id];try{localStorage.setItem('fav',JSON.stringify(favs))}catch(x){};render()};
  $('#grid').append(c)});
 if(!L.length)$('#grid').innerHTML='<p class="empty">Здесь пока пусто.</p>';
}
$('#q').oninput=e=>{q=e.target.value.toLowerCase();render()};
render();
</script></body></html>
