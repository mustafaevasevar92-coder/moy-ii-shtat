<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Спасибо за оплату · Мой ИИ-штат</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#151A3E;--ink:#F1EEF9;--muted:#A9A5C9;--berry:#B4128F;--pink:#FF7FD8;--card:#1B2150;--line:#2A3166}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:400 17px/1.6 "Golos Text",system-ui,sans-serif;padding:16px;box-sizing:border-box}
.box{max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 28px;text-align:center}
h1{font:900 clamp(24px,6vw,34px)/1.1 "Unbounded",system-ui,sans-serif;margin:0 0 16px}
h1 em{font-style:normal;color:var(--pink)}
p{color:var(--muted);margin:0 0 14px}
a.btn{display:inline-block;margin-top:10px;background:var(--berry);color:#fff;text-decoration:none;font-weight:600;padding:15px 24px;border-radius:14px}
</style>
</head>
<body>
<div class="box">
  <h1><em>Спасибо!</em></h1>
  <p>Когда оплата пройдёт, чек придёт на почту. Доступ к курсу и приглашения в группы пришлём в Telegram или на почту в течение суток.</p>
  <p>Старт курса 16 ноября.</p>
  <a class="btn" href="https://t.me/ii_dlya_sellerov_wb_bot">Задать вопрос в боте</a>
</div>
</body>
</html>
